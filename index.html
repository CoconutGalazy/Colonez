<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company.co</title>
<style>
:root{
  --bg:#12100E; --panel:#1A1714; --panel2:#221D18; --line:#2E2823;
  --bone:#E8E1D4; --dim:#95897A; --faint:#6A6055;
  --amber:#E0A32E; --rust:#B4532A; --up:#8FA85F; --down:#C7573A;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--mono);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:12px;color:var(--bone);background:var(--panel2);
  border:1px solid var(--line);padding:5px 10px;cursor:pointer;letter-spacing:.02em}
button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--rust);border-color:var(--rust);color:#F6EEE2}
button.primary:hover:not(:disabled){background:#C75F32;border-color:#C75F32;color:#fff}
button.ghost{background:transparent}
input,select{font-family:inherit;font-size:12px;color:var(--bone);background:#0D0B09;
  border:1px solid var(--line);padding:5px 7px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--amber)}
a{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--faint);padding:4px 8px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid rgba(46,40,35,.55);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#221D18}
tr.sel td{background:#2A2119}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)} .faint{color:var(--faint)}
.amber{color:var(--amber)} .rust{color:var(--rust)}

#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:18px;padding:8px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:17px;letter-spacing:.01em;color:var(--bone);font-weight:500}
.brand small{font-size:17px;letter-spacing:.01em;color:var(--amber)}
.stat{display:flex;flex-direction:column;min-width:92px}
.stat b{font-weight:500;font-size:13px}
.stat span{font-size:10px;color:var(--faint);letter-spacing:.1em}
.speed{margin-left:auto;display:flex;gap:4px;align-items:center}
nav{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);
  overflow-x:auto}
nav button{border:none;background:none;padding:9px 13px;color:var(--dim);border-bottom:2px solid transparent}
nav button.on{color:var(--amber);border-bottom-color:var(--rust)}
nav button:hover{color:var(--bone)}
main{flex:1;overflow:auto;padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:900px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line)}
.card h3{margin:0;padding:7px 10px;font-size:11px;font-weight:500;letter-spacing:.14em;
  color:var(--faint);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;gap:8px}
.card .body{padding:10px}
.card .scroll{max-height:300px;overflow:auto}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(46,40,35,.5)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--dim)}
.big{font-size:22px;letter-spacing:-.02em}
.pill{display:inline-block;padding:1px 6px;border:1px solid var(--line);font-size:10px;color:var(--dim)}
.pill.on{border-color:var(--up);color:var(--up)}
.pill.off{border-color:var(--down);color:var(--down)}
.pill.warn{border-color:var(--amber);color:var(--amber)}
.bar{height:4px;background:#0D0B09;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--rust)}
.log{font-size:11px;line-height:1.6}
.log div{padding:2px 0;border-bottom:1px solid rgba(46,40,35,.4)}
.log .d{color:var(--faint);margin-right:6px}
.log .event{color:var(--amber)} .log .good{color:var(--up)} .log .bad{color:var(--down)}
.log .contract{color:#9AA9C0} .log .market{color:var(--dim)}
.form{display:grid;gap:7px}
.form label{font-size:10px;letter-spacing:.1em;color:var(--faint);display:block;margin-bottom:2px}
.row{display:flex;gap:7px}
.row>*{flex:1}
.tick{font-size:11px;color:var(--faint);padding:4px 0}
.err{color:var(--down);font-size:11px;min-height:15px}
canvas{display:block;width:100%}
.depth{display:grid;grid-template-columns:1fr 1fr;gap:1px;font-size:11px}
.depth div{padding:2px 6px;display:flex;justify-content:space-between}
.depth .b{background:linear-gradient(to left,rgba(143,168,95,.16) var(--w,0%),transparent 0)}
.depth .a{background:linear-gradient(to right,rgba(199,87,58,.16) var(--w,0%),transparent 0)}
.chip{display:inline-flex;gap:5px;align-items:center;padding:2px 7px;border:1px solid var(--line);
  font-size:11px;margin:0 4px 4px 0;cursor:pointer;color:var(--dim)}
.chip.on{border-color:var(--amber);color:var(--amber)}
.overlay{position:fixed;inset:0;background:rgba(9,8,7,.93);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50;overflow:auto}
.sheet{max-width:820px;width:100%;background:var(--panel);border:1px solid var(--line);padding:26px}
.sheet h1{font-size:26px;letter-spacing:.04em;margin:0 0 2px;color:var(--bone);font-weight:500}
.sheet h1 .dot{color:var(--amber)}
.sheet p.lede{color:var(--dim);margin:0 0 20px;font-size:12px;max-width:62ch}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:9px}
.path{border:1px solid var(--line);padding:11px;cursor:pointer;background:var(--panel2)}
.path:hover{border-color:var(--amber)}
.path.on{border-color:var(--rust);background:#241C16}
.path b{display:block;color:var(--bone);margin-bottom:3px;font-weight:500}
.path small{color:var(--dim);font-size:11px;line-height:1.5;display:block}
.path .cap{color:var(--amber);font-size:11px;margin-top:6px;display:block}
.toast{position:fixed;right:14px;bottom:14px;background:var(--panel2);border:1px solid var(--amber);
  padding:8px 12px;font-size:12px;color:var(--bone);z-index:60;max-width:340px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0D0B09}
::-webkit-scrollbar-thumb{background:#2E2823}
::-webkit-scrollbar-thumb:hover{background:#4A4038}

/* ============================================================
   SHELL LAYER - scene, overlays, login, tutorial, menus
   Added in the polish pass; the game's own styles above are untouched
   except where a rule here deliberately softens them.
   ============================================================ */
#sky{position:fixed;inset:0;z-index:0;display:block}
.mini{padding:3px 8px;font-size:10.5px;letter-spacing:.06em;margin-left:4px}
.mini.go{background:var(--rust);color:#F6EEE2;border-color:var(--rust)}
.stat.era b{font-size:12.5px;letter-spacing:.02em;display:block;color:var(--amber)}
/* the path-picker sheet lets the scene through */
.overlay{background:rgba(9,8,7,.6)!important;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet{background:rgba(26,23,20,.92)!important;border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.55)}
.path{border-radius:10px;transition:border-color .18s ease,transform .18s ease,background .18s ease}
.path:hover{transform:translateY(-2px)}
.toast{border-radius:9px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
#app{position:relative;z-index:2}
#shell{position:fixed;inset:0;z-index:60;pointer-events:none}
#notes{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none}
#notes>*{pointer-events:auto}
#fade{position:fixed;inset:0;z-index:90;background:#0B0908;opacity:0;pointer-events:none;
  transition:opacity .26s ease}
#fade.on{opacity:1}
body.nomotion #fade{transition:none}

/* the game's panels float over the scene */
header,nav,.card,.sheet{backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
header{background:rgba(26,23,20,.86);border-radius:0 0 2px 2px}
nav{background:rgba(26,23,20,.78)}
.card{background:rgba(26,23,20,.86);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:border-color .18s ease,transform .18s ease}
.card:hover{border-color:#3A332C}
.card h3{border-radius:10px 10px 0 0}
button{border-radius:7px;transition:background .16s ease,border-color .16s ease,color .16s ease,
  transform .12s ease,box-shadow .16s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0) scale(.985)}
button.primary{box-shadow:0 4px 14px rgba(180,83,42,.28)}
input,select{border-radius:7px}
input:focus,select:focus{box-shadow:0 0 0 3px rgba(224,163,46,.14)}
body.bigtext{font-size:14.5px}
body.nomotion *{transition:none!important;animation:none!important}
.bar{border-radius:99px;overflow:hidden}
.bar i{transition:width .5s cubic-bezier(.22,.8,.3,1)}

/* clock in the header */
.stat.clock{min-width:104px}
#clockface b{font-size:15px;letter-spacing:.04em}
#clockface span{display:block;font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.clockbar{height:2px;background:#2A241E;border-radius:2px;margin:5px 0 3px;overflow:hidden}
.clockbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--amber));width:0}
.daynum{font-size:10px;color:var(--faint);letter-spacing:.1em}
.menubtn{margin-left:6px}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(8,7,6,.72);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:22px;overflow:auto}
.panel{width:100%;max-width:460px;background:linear-gradient(180deg,rgba(34,29,24,.97),rgba(22,19,16,.97));
  border:1px solid #352D26;border-radius:16px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel.wide{max-width:640px}
.panel.sm{max-width:390px}
.panel h2{margin:0 0 6px;font-size:16px;font-weight:500;letter-spacing:.1em;color:var(--bone)}
.panel p{margin:0 0 16px;color:var(--dim);font-size:12.5px;line-height:1.6}
.panel p.sub{color:var(--faint);font-size:11.5px;margin-bottom:14px}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.rowend{display:flex;gap:9px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.rowend .link{margin-right:auto}
.menu{display:flex;flex-direction:column;gap:7px}
.menu button{padding:11px 14px;text-align:left;font-size:12.5px}
button.link{background:none;border:none;color:var(--amber);padding:4px 2px;font-size:12px}
button.link:hover{color:#F2C264;text-decoration:underline}
button.ghost{background:transparent}
button.wide{width:100%;padding:11px;font-size:13px;letter-spacing:.08em}

/* login */
.authwrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:22px;overflow:auto}
.authcard{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(30,26,22,.92),rgba(18,16,14,.94));
  border:1px solid rgba(224,163,46,.16);border-radius:18px;padding:28px 26px 24px;
  box-shadow:0 30px 90px rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.authcard .mark{font-size:22px;letter-spacing:.01em;color:var(--bone);margin-bottom:22px;font-weight:500}
.authcard .mark span{color:var(--amber)}
.authcard h1{font-size:20px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.authcard .sub{color:var(--dim);font-size:12px;margin:0 0 20px;line-height:1.55}
.authfoot{max-width:380px;text-align:center;color:var(--faint);font-size:10.5px;line-height:1.6}
.fld{display:block;position:relative;margin-bottom:14px}
.fld span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:5px}
.fld input{padding:10px 11px;font-size:13px;background:rgba(10,9,8,.75)}
.fld .eye{position:absolute;right:6px;bottom:6px;padding:4px 8px;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;background:transparent;border:none;color:var(--faint)}
.fld .eye:hover{color:var(--amber);transform:none}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:2px 0 18px;cursor:pointer}
.check input{width:auto;accent-color:#B4532A}
.links{margin-top:12px;font-size:12px;color:var(--dim)}
.links.center{text-align:center}
.hr{display:flex;align-items:center;gap:10px;margin:18px 0 6px;color:var(--faint);font-size:10.5px}
.hr:before,.hr:after{content:"";flex:1;height:1px;background:var(--line)}
.msg{font-size:11.5px;padding:9px 11px;border-radius:8px;margin-bottom:12px;line-height:1.55}
.msg.bad{background:rgba(199,87,58,.12);border:1px solid rgba(199,87,58,.35);color:#E29B86}
.msg.good{background:rgba(143,168,95,.12);border:1px solid rgba(143,168,95,.3);color:#B6CB8D}
.msg.note{background:rgba(224,163,46,.08);border:1px solid rgba(224,163,46,.25);color:#D9BE85}
.local{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.local b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.local p{font-size:11.5px;color:var(--dim);margin:6px 0 12px}

/* tutorial */
.panel.tut{max-width:480px}
.tuthead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.ticon{width:40px;height:40px;flex:none;fill:none;stroke:var(--amber);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tuthead h2{margin:0}
.step{font-size:10.5px;letter-spacing:.16em;color:var(--faint)}
.dots{display:flex;gap:6px;margin-top:4px}
.dots i{width:22px;height:3px;border-radius:2px;background:#332C25;transition:background .3s ease}
.dots i.on{background:var(--amber)}
.dots i.done{background:#6A4A28}

/* settings */
.setgrid{display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto;padding-right:4px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 2px;
  border-bottom:1px solid rgba(46,40,35,.7)}
.setrow b{display:block;font-size:12.5px;font-weight:500;color:var(--bone)}
.setrow span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;max-width:34ch}
.setrow>div:last-child{display:flex;align-items:center;gap:7px;flex:none}
.setrow input[type=range]{width:116px;accent-color:#B4532A}
.setrow em{font-style:normal;font-size:11px;color:var(--dim);width:24px;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 11px;font-size:11px;background:transparent}
.seg button.on{background:var(--rust);color:#F6EEE2}
.sw{width:42px;height:23px;border-radius:99px;background:#241F1A;border:1px solid var(--line);
  padding:0;position:relative}
.sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--faint);transition:left .18s ease,background .18s ease}
.sw.on{background:rgba(180,83,42,.3);border-color:var(--rust)}
.sw.on i{left:21px;background:var(--amber)}
.dimtext{font-size:11.5px;color:var(--dim)}
.keys{width:100%;font-size:12px}
.keys td{padding:6px 4px;color:var(--dim)}
kbd{display:inline-block;background:#241F1A;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:2px 7px;font-size:11px;color:var(--bone);margin-right:3px}

/* notifications and hints */
.note{background:rgba(30,26,22,.95);border:1px solid var(--line);border-left:2px solid var(--amber);
  border-radius:9px;padding:10px 13px;font-size:12px;color:var(--bone);max-width:330px;
  box-shadow:0 12px 34px rgba(0,0,0,.45);animation:pop .28s ease;transition:opacity .5s ease,transform .5s ease}
.note.bad{border-left-color:var(--down)}
.note.go{opacity:0;transform:translateX(14px)}
.hint{background:rgba(30,26,22,.96);border:1px solid rgba(224,163,46,.3);border-radius:11px;
  padding:13px 15px;max-width:320px;box-shadow:0 16px 40px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease}
.hint.in{opacity:1;transform:none}
.hint b{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);margin-bottom:5px}
.hint p{margin:0;font-size:12px;color:var(--dim);line-height:1.55}
.hint .rowend{margin-top:9px}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app"></div>
<div id="shell"></div>
<div id="notes"></div>
<div id="fade"></div>
<script>

/* ============================================================
   company.co - simulation core, part 1: static data
   No DOM references in core_data.js / core_sim.js.
   ============================================================ */
var ECON = (function () {
"use strict";

var WAGE_UNIT = 10;      // reference $/labor-hour
var TAX_RATE = 0.16;     // corporate tax on daily operating profit
var BASE_INTEREST = 0.075;

var COMM = [
  { id:"iron_ore",  name:"Iron ore",       tier:0, p0:12,   w:1.6, unit:"t"  },
  { id:"coal",      name:"Coal",           tier:0, p0:8.5,  w:1.6, unit:"t"  },
  { id:"copper_ore",name:"Copper ore",     tier:0, p0:18,   w:1.6, unit:"t"  },
  { id:"timber",    name:"Timber",         tier:0, p0:6.5,  w:1.7, unit:"m3" },
  { id:"crude_oil", name:"Crude oil",      tier:0, p0:12.5, w:1.4, unit:"bbl"},
  { id:"steel",     name:"Steel",          tier:1, p0:60,   w:1.0, unit:"t"  },
  { id:"refined_copper", name:"Refined copper", tier:1, p0:95, w:1.0, unit:"t" },
  { id:"lumber",    name:"Lumber",         tier:1, p0:24,   w:1.1, unit:"m3" },
  { id:"fuel",      name:"Fuel",           tier:1, p0:45,   w:0.9, unit:"kl" },
  { id:"machines",  name:"Machines",       tier:2, p0:1000, w:0.5, unit:"ea" },
  { id:"constr",    name:"Building material", tier:2, p0:300, w:0.8, unit:"t" },
  { id:"vehicles",  name:"Vehicles",       tier:2, p0:3550, w:0.5, unit:"ea" },
  { id:"grain",     name:"Grain",          tier:0, p0:5,    w:1.5, unit:"t",  era:1 },
  { id:"flour",     name:"Flour",          tier:1, p0:16,   w:1.2, unit:"t",  era:1 },
  { id:"provisions",name:"Packaged food",  tier:2, p0:44,   w:0.9, unit:"cs", era:2 },
  { id:"plastic",   name:"Plastic",        tier:1, p0:67,   w:0.8, unit:"t",  era:3 },
  { id:"components",name:"Components",     tier:2, p0:145,  w:0.5, unit:"kg", era:3 },
  { id:"electronics",name:"Electronics",   tier:2, p0:690,  w:0.4, unit:"ea", era:4 },
  { id:"robotics",  name:"Robotics",       tier:2, p0:5600, w:0.5, unit:"ea", era:5 }
];
var CMAP = {}; COMM.forEach(function (c) { CMAP[c.id] = c; });

/* Five ages of industry. Each opens new plant, new goods and new demand.
   The world advances when somebody does the research - usually the player,
   otherwise the trade as a whole gets there eventually. */
var ERAS = [
  { n:1, id:"steam",     name:"Steam and Iron",
    blurb:"Coal, iron and timber. Everything is heavy, slow and made by hand." },
  { n:2, id:"mass",      name:"Mass Production",
    blurb:"Oil, copper and the moving line. Machines start making machines." },
  { n:3, id:"petro",     name:"Petrochemical Age",
    blurb:"Polymers and precision components. Materials science changes what is possible." },
  { n:4, id:"electronic",name:"Electronic Age",
    blurb:"Circuits everywhere. Value moves from tonnage to intricacy." },
  { n:5, id:"automation",name:"Automation and Robotics",
    blurb:"Plant that runs itself, and sells the means to do it." }
];
var ERA_DEFAULT_DAY = { 3: 150, 4: 300, 5: 470 };   // the trade gets there on its own eventually

var REGIONS = [

  var u = 0, inv = co.inv[rid] || {};
  for (var k in inv) u += inv[k] * CMAP[k].w;
  return u;
}
function haulCap(G, co) {
  var c = 0;
  co.buildings.forEach(function (b) { if (BUILD[b.type].haul) c += BUILD[b.type].haul; });
  return c * (co.tech.fleet_scale ? 1.6 : 1);
}
function haulUsed(G, co) {
  var u = 0;
  G.shipments.forEach(function (s) { if (s.carrier === co.id) u += s.load; });
  return u;
}

/* ---------- prices & freight ---------- */
function book(G, rid, cid) { return G.books[rid][cid]; }
function price(G, rid, cid) { return book(G, rid, cid).ema; }
function bestAsk(G, rid, cid) { var b = book(G, rid, cid); return b.asks.length ? b.asks[0].price : null; }
function bestBid(G, rid, cid) { var b = book(G, rid, cid); return b.bids.length ? b.bids[0].price : null; }

function freightRate(G, from, to, cid) {
  var d = E.dist(from, to);
  var key = from < to ? from + "|" + to : to + "|" + from;
  var mod = G.freightMod[key] || 1;
  var fuelIdx = 0.55 + 0.45 * (price(G, "HAL", "fuel") / CMAP.fuel.p0);
  return CMAP[cid].p0 * 0.00045 * CMAP[cid].w * d * mod * fuelIdx;
}
function freightCost(G, co, from, to, cid, qty) {
  var base = freightRate(G, from, to, cid) * qty;
  if (co && co.tech.route_planning) base *= 0.82;
  return base;
}
function transitDays(from, to) { return Math.max(1, Math.round(E.dist(from, to) / 260)); }

/* ---------- order book ---------- */
function placeOrder(G, co, side, cid, rid, price, qty, ttl) {
  qty = Math.floor(qty); if (qty <= 0 || !(price > 0)) return null;
  var bk = book(G, rid, cid);
  if (side === "buy") {
    var free = co.sink ? Infinity : co.cash - co.escrow;
    var afford = Math.floor(free / price);
    qty = Math.min(qty, afford);
    if (qty <= 0) return null;
    if (!co.sink) co.escrow += qty * price;
  } else {
    qty = Math.min(qty, Math.floor(avail(co, rid, cid)));
    if (qty <= 0) return null;
    resAdd(co, rid, cid, qty);
  }
  var o = { id: "O" + (G.nextO++), t: G.ticks++, co: co.id, side: side, cid: cid, rid: rid,
            price: round2(price), qty: qty, ttl: ttl === undefined ? 4 : ttl };
  (side === "buy" ? bk.bids : bk.asks).push(o);
  sortBook(bk);
  if (co.orders) co.orders.push(o);
  matchBook(G, rid, cid);
  return o;
}
function sortBook(bk) {
  bk.bids.sort(function (a, b) { return b.price - a.price || a.t - b.t; });
  bk.asks.sort(function (a, b) { return a.price - b.price || a.t - b.t; });
}
function cancelOrder(G, o) {
  var bk = book(G, o.rid, o.cid);
  var arr = o.side === "buy" ? bk.bids : bk.asks;
  var i = arr.indexOf(o); if (i < 0) return false;
  arr.splice(i, 1);
  releaseOrder(G, o);
  return true;
}
function releaseOrder(G, o) {
  var co = G.co[o.co]; if (!co) return;
  if (o.side === "buy") { if (!co.sink) co.escrow -= o.qty * o.price; }
  else resAdd(co, o.rid, o.cid, -o.qty);
  if (co.orders) { var i = co.orders.indexOf(o); if (i >= 0) co.orders.splice(i, 1); }
}

function matchBook(G, rid, cid) {
  var bk = book(G, rid, cid);
  var guard = 0;
  while (bk.bids.length && bk.asks.length && bk.bids[0].price >= bk.asks[0].price && guard++ < 500) {
    var b = bk.bids[0], a = bk.asks[0];
    var buyer = G.co[b.co], seller = G.co[a.co];
    var p = b.t < a.t ? b.price : a.price;
    var q = Math.min(b.qty, a.qty);
    // seller must still hold the goods
    var have = Math.floor(invGet(seller, rid, cid));
    if (have < q) q = have;
    if (q <= 0) { // stale sell order
      bk.asks.shift(); releaseOrder(G, a); continue;
    }
    var unit = p;
    if (buyer.sink && CMAP[cid].tier === 2 && seller.tech && seller.tech.quality_control) unit = p * 1.07;
    var gross = unit * q;
    var fee = buyer.sink ? gross * 0.002 : gross * 0.0035;

    // buyer side
    if (!buyer.sink) {
      buyer.escrow -= q * b.price;
      buyer.cash -= gross + fee;
      buyer.day.cogs += gross; buyer.day.fees += fee;
      invAdd(buyer, rid, cid, q);
      buyer.stats.bought[cid] = (buyer.stats.bought[cid] || 0) + q;
      var bas = buyer.ai && buyer.ai.basis;
      if (bas) {
        var prev = bas[cid] || { q: 0, v: 0 };
        bas[cid] = { q: prev.q + q, v: prev.v + gross };
      }
    } else {
      G.flow.faucet += gross;
      G.flow.by = G.flow.by || {};
      G.flow.by[cid] = (G.flow.by[cid] || 0) + q;
    }
    // seller side
    var sfee = gross * 0.0035;
    seller.cash += gross - sfee;
    seller.day.rev += gross; seller.day.fees += sfee;
    invAdd(seller, rid, cid, -q);
    resAdd(seller, rid, cid, -q);
    seller.stats.sold[cid] = (seller.stats.sold[cid] || 0) + q;
    G.flow.sink += sfee + (buyer.sink ? fee : fee);
    if (seller.ai && seller.ai.basis && seller.ai.basis[cid]) {
      var sb = seller.ai.basis[cid];
      var used = Math.min(sb.q, q);
      if (sb.q > 0) { sb.v -= (sb.v / sb.q) * used; sb.q -= used; }
    }

    b.qty -= q; a.qty -= q;
    bk.last = p; bk.ema = bk.ema * 0.82 + p * 0.18;
    bk.dayVol += q; bk.dayVal += gross;
    bk.trades.push({ d: G.day, p: round2(p), q: q, b: b.co, s: a.co });
    if (bk.trades.length > 60) bk.trades.shift();

    if (b.qty <= 0) { bk.bids.shift(); if (buyer.orders) { var i1 = buyer.orders.indexOf(b); if (i1 >= 0) buyer.orders.splice(i1, 1); } }
    if (a.qty <= 0) { bk.asks.shift(); if (seller.orders) { var i2 = seller.orders.indexOf(a); if (i2 >= 0) seller.orders.splice(i2, 1); } }
  }
}

function expireOrders(G) {
  REGIONS.forEach(function (r) {
    COMM.forEach(function (c) {
      var bk = book(G, r.id, c.id);
      ["bids", "asks"].forEach(function (k) {
        for (var i = bk[k].length - 1; i >= 0; i--) {
          var o = bk[k][i];
          o.ttl -= 1;
          if (o.ttl <= 0) { bk[k].splice(i, 1); releaseOrder(G, o); }
        }
      });
      sortBook(bk);
    });
  });
}

/* ---------- technology effects ---------- */
function tf(co, k) { return co.tech && co.tech[k]; }
function outMult(G, co, b) {
  var d = BUILD[b.type], m = 1;
  if (d.cls === "extract" && tf(co, "deep_drilling")) m *= 1.14;
  if ((b.type === "machine_works" || b.type === "vehicle_plant") && tf(co, "precision_tools")) m *= 1.12;
  if (G.worldTech[b.type]) m *= G.worldTech[b.type];
  return m;
}
function inpMult(co, b, cid) {
  var m = 1;
  if (tf(co, "ore_sorting") && (b.type === "steel_mill" || b.type === "copper_refinery") &&
      (cid === "iron_ore" || cid === "copper_ore")) m *= 0.90;
  return m;
}
function energyMult(co, b) {
  var m = 1;
  if (tf(co, "arc_furnace") && BUILD[b.type].cls === "process") m *= 0.82;
  if (tf(co, "cogeneration")) m *= 0.74;
  return m;
}
function energyPriceMult(co) { return tf(co, "grid_contracts") ? 0.84 : 1; }
function laborMult(co) { return (tf(co, "automation_1") ? 0.88 : 1) * (tf(co, "automation_2") ? 0.86 : 1); }
function maintMult(co) { return (tf(co, "preventive_maint") ? 0.78 : 1) * (tf(co, "automation_2") ? 0.94 : 1); }
function levelThroughput(b) { return [0, 1, 1.3, 1.6, 1.85][b.level] || 1; }

/* ---------- production ---------- */
function buildingActive(b) { return !b.idle && b.down <= 0; }

function computeFactors(G) {
  REGIONS.forEach(function (r) {
    var rs = G.regionState[r.id];
    rs.laborUse = 0; rs.euse = 0;
  });
  G.buildings.forEach(function (b) {
    if (!buildingActive(b)) return;
    var co = G.co[b.owner]; if (!co) return;
    var d = BUILD[b.type], th = levelThroughput(b), rs = G.regionState[b.rid];
    rs.laborUse += d.labor * th * laborMult(co);
    rs.euse += d.energy * th * energyMult(co, b);
  });
  REGIONS.forEach(function (r) {
    var rs = G.regionState[r.id];
    var pool = r.labor * rs.laborMod;
    var ecap = r.ecap;
    var lu = rs.laborUse / Math.max(1, pool);
    rs.wage = r.wage * (0.85 + 0.55 * Math.pow(Math.min(lu, 2.2), 1.6)) * G.macro.priceIndex;
    rs.laborScale = lu > 1 ? 1 / lu : 1;
    rs.labor = pool;
    var eu = rs.euse / Math.max(1, ecap);
    rs.eprice = r.eprice * (0.72 + 0.85 * Math.pow(Math.min(eu, 2.2), 2)) * rs.energyMod;
    rs.eScale = eu > 1 ? 1 / eu : 1;
    rs.eutil = eu; rs.lutil = lu;
  });
}

function produceAll(G) {
  MAINT_SINK.g = G;
  G.buildings.forEach(function (b) {
    var co = G.co[b.owner]; if (!co || co.bankrupt) return;
    var d = BUILD[b.type], rs = G.regionState[b.rid];
    if (b.down > 0) { b.down--; b.util = 0; payMaint(co, b, 0.4); return; }
    if (b.idle) { b.util = 0; payMaint(co, b, 0.4); return; }
    if (d.cls === "support") { b.util = 1; payOps(G, co, b, 1); return; }

    var th = levelThroughput(b);
    var scale = Math.min(rs.laborScale, rs.eScale, 1) * b.cond * (b.rate === undefined ? 1 : b.rate);

    // input availability
    var k;
    for (k in d.inp) {
      var need = d.inp[k] * th * inpMult(co, b, k);
      var got = invGet(co, b.rid, k);
      if (need > 0) scale = Math.min(scale, got / need);
    }
    // deposit availability
    if (d.dep) {
      var res = rs.deposits[d.dep] || 0;
      var full = res > 60000 ? 1 : Math.max(0, 0.35 + 0.65 * (res / 60000));
      scale *= full;
      if (res <= 0) scale = 0;
    }
    // storage room for outputs
    var room = storageCap(G, co, b.rid) - storageUsed(G, co, b.rid);
    var loadPer = 0;
    for (k in d.out) loadPer += d.out[k] * th * CMAP[k].w * outMult(G, co, b);
    if (loadPer > 0 && room < loadPer * scale) scale = Math.max(0, room / loadPer);
    scale = clamp(scale, 0, 1);

    if (scale > 0) {
      for (k in d.inp) invAdd(co, b.rid, k, -d.inp[k] * th * inpMult(co, b, k) * scale);
      var om = outMult(G, co, b) * wagePol(co).prod;
      for (k in d.out) {
        var q = d.out[k] * th * om * scale;
        invAdd(co, b.rid, k, q);
        co.stats.produced[k] = (co.stats.produced[k] || 0) + q;
        if (d.dep && rs.deposits[d.dep] !== undefined) rs.deposits[d.dep] = Math.max(0, rs.deposits[d.dep] - q);
      }
    }
    b.util = scale;
    payOps(G, co, b, scale);
  });
}
/* What a site costs to run: the payroll, the power, and what it owes for what
   goes up the chimney. Wage policy and environmental policy both bite here. */
var WAGE_POLICY = { lean:{ pay:0.88, prod:0.93, unrest:2.2 },
                    standard:{ pay:1.00, prod:1.00, unrest:1.0 },
                    generous:{ pay:1.16, prod:1.07, unrest:0.35 } };
var GREEN_POLICY = { dirty:{ energy:0.90, emit:1.7 },
                     standard:{ energy:1.00, emit:1.0 },
                     clean:{ energy:1.09, emit:0.38 } };
function wagePol(co) { return WAGE_POLICY[(co.policy && co.policy.wage) || "standard"]; }
function greenPol(co) { return GREEN_POLICY[(co.policy && co.policy.green) || "standard"]; }
function payOps(G, co, b, scale) {
  var d = BUILD[b.type], rs = G.regionState[b.rid], th = levelThroughput(b);
  var wp = wagePol(co), gp = greenPol(co);
  var wages = d.labor * th * laborMult(co) * rs.wage * wp.pay * (0.25 + 0.75 * scale);
  var power = d.energy * th * energyMult(co, b) * gp.energy;
  var energy = power * rs.eprice * energyPriceMult(co) * (0.2 + 0.8 * scale);
  var emit = power * gp.emit * (0.25 + 0.75 * scale) * 0.001;
  co.emissions = (co.emissions || 0) + emit;
  G.pollution += emit;
  var levy = emit * (G.carbonFee || 0);
  co.cash -= wages + energy + levy;
  co.day.wages += wages; co.day.energy += energy + levy;
  G.flow.sink += wages + energy + levy;
  payMaint(co, b, 1);
}
var MAINT_SINK = { g: null };
function payMaint(co, b, f) {
  var d = BUILD[b.type];
  var m = d.maint * f * maintMult(co) * (1 + (levelThroughput(b) - 1) * 0.8);
  co.cash -= m; co.day.maint += m;
  if (MAINT_SINK.g) MAINT_SINK.g.flow.sink += m;
}

/* ---------- consumer demand ---------- */
function postConsumerOrders(G) {
  var con = G.consumer;
  // clear last tick's consumer orders
  REGIONS.forEach(function (r) {
    COMM.forEach(function (c) {
      var bk = book(G, r.id, c.id);
      for (var i = bk.bids.length - 1; i >= 0; i--) if (bk.bids[i].co === "CON") bk.bids.splice(i, 1);
    });
  });
  con.orders = [];
  REGIONS.forEach(function (r) {
    var rs = G.regionState[r.id];
    for (var cid in CONSUMER_GOODS) {
      var line = CONSUMER_GOODS[cid];
      if (line.era > G.era) continue;                    // not invented here yet
      var ramp = line.era === G.era ? Math.min(1, 0.35 + (G.day - (G.eraDay || 0)) / 90) : 1;
      var base = line.q * ramp * (r.demand / DEMAND_WEIGHT) * G.econ * (G.growth || 1) *
                 (G.macro.employIdx || 1) * rs.demandMod * (G.demandMod[cid] || 1);
      if (base <= 0) continue;
      var p0 = CMAP[cid].p0 * G.macro.priceIndex;
      var rungs = 6;
      for (var i = 0; i < rungs; i++) {
        var pf = 1.55 - i * 0.16;                 // willingness to pay, 1.55 p0 down to 0.75 p0
        var q = base / rungs * (0.85 + 0.3 * G.rnd());
        if (q < 0.4) continue;
        placeOrder(G, con, "buy", cid, r.id, p0 * pf, Math.max(1, Math.round(q)), 1);
      }
    }
  });
  // state buyers created by events (public works, conflict)
  G.events.forEach(function (ev) {
    if (ev.buy) {
      placeOrder(G, con, "buy", ev.buy.cid, ev.buy.rid, CMAP[ev.buy.cid].p0 * ev.buy.pf,
                 ev.buy.qty, 1);
    }
  });
}

/* ---------- shipments & freight jobs ---------- */
function startShipment(G, co, from, to, cid, qty, carrierId) {
  qty = Math.floor(qty);
  if (qty <= 0 || from === to) return null;
  if (avail(co, from, cid) < qty) return null;
  var cost = freightCost(G, co, from, to, cid, qty);
  var load = qty * CMAP[cid].w;
  var self = haulCap(G, co) - haulUsed(G, co) >= load;
  if (self) cost *= 0.55;
  if (co.cash - co.escrow < cost) return null;
  invAdd(co, from, cid, -qty);
  co.cash -= cost; co.day.freight += cost;
  var s = { id: "S" + (G.nextS++), co: co.id, from: from, to: to, cid: cid, qty: qty,
            arrive: G.day + transitDays(from, to), cost: cost, load: load,
            carrier: self ? co.id : null };
  G.shipments.push(s);
  if (!self) {
    // offered to the freight market: player and AI hauliers can take the job
    G.jobs.push({ id: "J" + (G.nextS++), ship: s.id, from: from, to: to, cid: cid, qty: qty,
                  load: load, pay: cost * 0.72, arrive: s.arrive, taken: null, posted: G.day });
    G.flow.sink += cost * 0.28;
  } else {
    G.flow.sink += cost;
  }
  return s;
}
function takeJob(G, co, job) {
  if (job.taken) return false;
  if (haulCap(G, co) - haulUsed(G, co) < job.load) return false;
  var s = null;
  G.shipments.forEach(function (x) { if (x.id === job.ship) s = x; });
  if (!s) return false;
  job.taken = co.id; s.carrier = co.id;
  s.payTo = co.id; s.pay = job.pay * (co.tech.fleet_scale ? 1.15 : 1);
  return true;
}
function arriveShipments(G) {
  for (var i = G.shipments.length - 1; i >= 0; i--) {
    var s = G.shipments[i];
    if (s.arrive > G.day) continue;
    var co = G.co[s.co];
    if (co) invAdd(co, s.to, s.cid, s.qty);
    if (s.payTo && G.co[s.payTo]) {
      var h = G.co[s.payTo];
      // running the trucks costs crew and diesel, and diesel tracks the fuel market
      var fuelIdx = 0.55 + 0.45 * (price(G, "HAL", "fuel") / CMAP.fuel.p0);
      var runCost = s.pay * (0.30 + 0.25 * fuelIdx);
      h.cash += s.pay - runCost;
      h.day.rev += s.pay; h.day.freight += runCost;
      G.flow.sink += runCost;
    }
    G.shipments.splice(i, 1);
    for (var j = G.jobs.length - 1; j >= 0; j--) if (G.jobs[j].ship === s.id) G.jobs.splice(j, 1);
  }
  // stale untaken jobs are hauled by the open market
  for (var k = G.jobs.length - 1; k >= 0; k--) {
    if (!G.jobs[k].taken && G.day - G.jobs[k].posted > 1) G.jobs.splice(k, 1);
  }
}

/* ---------- contracts ---------- */
function postOffer(G, co, side, cid, rid, qtyPer, interval, deliveries, price) {
  var o = { id: "K" + (G.nextK++), from: co.id, side: side, cid: cid, rid: rid,
            qtyPer: Math.floor(qtyPer), interval: interval, deliveries: deliveries,
            price: round2(price), posted: G.day, ttl: 8, taker: null };
  G.offers.push(o);
  return o;
}
function acceptOffer(G, co, o) {
  if (o.taker) return false;
  o.taker = co.id;
  var k = { id: "K" + (G.nextK++), seller: o.side === "sell" ? o.from : co.id,
            buyer: o.side === "sell" ? co.id : o.from, cid: o.cid, rid: o.rid,
            qtyPer: o.qtyPer, interval: o.interval, left: o.deliveries, price: o.price,
            next: G.day + o.interval, start: G.day, done: 0, failed: 0 };
  G.contracts.push(k);
  var A = G.co[k.seller], B = G.co[k.buyer];
  if (A.contracts) A.contracts.push(k);
  if (B.contracts) B.contracts.push(k);
  var i = G.offers.indexOf(o); if (i >= 0) G.offers.splice(i, 1);
  logMsg(G, G.co[o.from].name + " and " + co.name + " sign a supply contract for " +
    o.qtyPer + " " + CMAP[o.cid].name.toLowerCase() + " x" + o.deliveries + " at $" + o.price + ".", "contract");
  return true;
}
function runContracts(G) {
  for (var i = G.contracts.length - 1; i >= 0; i--) {
    var k = G.contracts[i];
    if (k.next > G.day) continue;
    var S = G.co[k.seller], B = G.co[k.buyer];
    var value = k.qtyPer * k.price;
    var can = S && !S.bankrupt && avail(S, k.rid, k.cid) >= k.qtyPer;
    var pays = B && !B.bankrupt && (B.cash - B.escrow) >= value;
    if (can && pays) {
      invAdd(S, k.rid, k.cid, -k.qtyPer);
      invAdd(B, k.rid, k.cid, k.qtyPer);
      S.cash += value; S.day.rev += value;
      B.cash -= value; B.day.cogs += value;
      S.stats.sold[k.cid] = (S.stats.sold[k.cid] || 0) + k.qtyPer;
      B.stats.bought[k.cid] = (B.stats.bought[k.cid] || 0) + k.qtyPer;
      k.done++;
      S.rep = Math.min(1.2, S.rep + 0.004); B.rep = Math.min(1.2, B.rep + 0.004);
    } else {
      var d = can ? B : S;
      var pen = value * 0.25;
      if (d) {
        d.cash -= pen; d.day.penalty += pen; d.rep = Math.max(0.3, d.rep - 0.07);
        G.flow.sink += pen;
        var other = d === S ? B : S;
        if (other) { other.cash += pen * 0.6; other.day.rev += pen * 0.6; }
        if (d.isPlayer) logMsg(G, "Contract default: " + CMAP[k.cid].name + " delivery missed. Penalty $" +
          Math.round(pen).toLocaleString() + ".", "bad");
        else if (other && other.isPlayer) logMsg(G, d.name + " missed a contract delivery. You received $" +
          Math.round(pen * 0.6).toLocaleString() + " in compensation.", "good");
      }
      k.failed++;
    }
    k.left--; k.next = G.day + k.interval;
    if (k.left <= 0) {
      G.contracts.splice(i, 1);
      [S, B].forEach(function (c) { if (c && c.contracts) { var j = c.contracts.indexOf(k); if (j >= 0) c.contracts.splice(j, 1); } });
    }
  }
  for (var m = G.offers.length - 1; m >= 0; m--) {
    G.offers[m].ttl--;
    if (G.offers[m].ttl <= 0) G.offers.splice(m, 1);
  }
}

/* ---------- finance ---------- */
function creditLimit(G, co) {
  return Math.max(0, valuation(G, co) * 0.5 * co.rep - co.debt);
}
function borrow(G, co, amt) {

      var target;
      if (bk.dayVol > 0) target = bk.dayVal / bk.dayVol;
      else if (bb !== null && ba !== null) target = (bb + ba) / 2;
      else if (ba !== null) target = Math.min(bk.ema, ba) * 0.97;
      else if (bb !== null) target = Math.max(bk.ema, bb) * 1.03;
      else target = parity(G, r.id, c.id);
      var w = bk.dayVol > 0 ? 0.30 : 0.20;
      bk.ema = bk.ema * (1 - w) + target * w;
      // beyond this band, foreign cargo or foreign buyers would step in
      bk.ema = clamp(bk.ema, CMAP[c.id].p0 * 0.45, CMAP[c.id].p0 * 1.8);
    });
  });
}


/* ============================================================
   THE WIDER ECONOMY
   Unemployment comes out of how much labour the country's plant is actually
   using. Inflation comes out of tight labour and hot demand, and lifts wages
   and shop prices together so the real terms of trade are unchanged - what it
   really does is move the central bank, which moves everybody's debt costs.
   ============================================================ */
function macroTick(G) {
  var m = G.macro, use = 0, pool = 0;
  REGIONS.forEach(function (r) {
    var rs = G.regionState[r.id];
    use += rs.laborUse; pool += r.labor * rs.laborMod;
  });
  var tight = use / Math.max(1, pool);
  m.unemployment = m.unemployment * 0.97 + clamp(1 - tight, 0.01, 0.45) * 0.03;
  var press = (tight - 0.86) * 0.035 + (G.econ - 1) * 0.02;
  m.inflation = clamp(m.inflation * 0.96 + press * 0.04, -0.025, 0.07);
  m.priceIndex *= 1 + m.inflation / 365;
  var target = 0.04 + m.inflation * 2.4 + (G.econ - 1) * 0.04;
  m.rate = clamp(m.rate * 0.985 + target * 0.015, 0.02, 0.2);
  m.cycle = G.econ;
  m.employIdx = clamp(1 - (m.unemployment - 0.15) * 0.6, 0.85, 1.08);
}

/* Ages of industry. The player can pull the world forward by finishing the
   research first - and sell into a market nobody else can supply yet. */
function eraTick(G) {
  var next = G.era + 1;
  if (next > 5) return;
  var pioneer = G.player && G.player.tech && G.player.tech["era" + next];
  var scheduled = E.ERA_DEFAULT_DAY[next] && G.day >= E.ERA_DEFAULT_DAY[next];
  if (!pioneer && !scheduled) return;
  G.era = next; G.eraDay = G.day;
  var era = E.ERAS[next - 1];
  G.eraLog.push({ era: next, day: G.day, pioneer: !!pioneer });
  logMsg(G, (pioneer ? "Your laboratories open the " : "The trade enters the ") + era.name +
    ". " + era.blurb, pioneer ? "good" : "event");
}

/* ============================================================
   SHARES
   Every company is quoted. Price follows book value with a mood attached to
   recent trading. Buying a majority lets you take the company over outright.
   ============================================================ */
function floatOf(G, co) {
  var held = 0;
  G.companies.forEach(function (c) { if (c.held && c.held[co.id]) held += c.held[co.id]; });
  return Math.max(0, co.shares - held);
}
function heldBy(G, holder, targetId) { return (holder.held && holder.held[targetId]) || 0; }
function shareTick(G) {
  G.companies.forEach(function (co) {
    if (co.bankrupt) { co.sharePrice = 0; return; }
    var fair = Math.max(0.4, valuation(G, co) / co.shares);
    var run = co.hist.slice(-12).reduce(function (a, h) { return a + h.p; }, 0);
    var mood = 0.94 + 0.12 * G.rnd() + (run > 0 ? 0.05 : -0.05);
    co.sharePrice = co.sharePrice * 0.88 + fair * mood * 0.12;
    co.shareHist.push(round2(co.sharePrice));
    if (co.shareHist.length > 140) co.shareHist.shift();
  });
}
function dividends(G) {
  G.companies.forEach(function (co) {
    if (co.bankrupt) return;
    var earned = co.hist.slice(-30).reduce(function (a, h) { return a + h.p; }, 0);
    if (earned <= 0) return;
    var pot = earned * 0.22;
    if (co.cash - co.escrow < pot * 1.5) return;      // never pay a dividend you cannot fund
    co.cash -= pot; co.divPaid += pot;
    var perShare = pot / co.shares;
    var toFloat = perShare * floatOf(G, co);
    G.flow.sink += toFloat;                            // the public float is outside the game
    G.companies.forEach(function (h) {
      var q = heldBy(G, h, co.id);
      if (q > 0) { h.cash += perShare * q; h.day.rev += perShare * q; }
    });
    if (co.isPlayer) logMsg(G, "Dividend paid: " + Math.round(pot).toLocaleString() + " to shareholders.", "info");
  });
}
function buyShares(G, buyer, targetId, qty) {
  var t = G.co[targetId];
  if (!t || t.bankrupt || t === buyer) return { ok: false, msg: "Not a listed company." };
  qty = Math.floor(qty);
  var avail = floatOf(G, t);
  if (qty <= 0) return { ok: false, msg: "Nothing to buy." };
  if (qty > avail) qty = avail;
  var px = t.sharePrice * 1.01, cost = px * qty;
  if (buyer.cash - buyer.escrow < cost) return { ok: false, msg: "Not enough free cash for that block." };
  buyer.cash -= cost; buyer.day.capex += cost; G.flow.sink += cost;
  buyer.held = buyer.held || {};
  buyer.held[targetId] = (buyer.held[targetId] || 0) + qty;
  return { ok: true, qty: qty, cost: cost };
}
function sellShares(G, seller, targetId, qty) {
  var t = G.co[targetId];
  var have = heldBy(G, seller, targetId);
  qty = Math.min(Math.floor(qty), have);
  if (!t || qty <= 0) return { ok: false, msg: "You hold none of those." };
  var px = t.sharePrice * 0.99, take = px * qty;
  seller.held[targetId] -= qty;
  seller.cash += take; seller.day.rev += take; G.flow.faucet += take;
  return { ok: true, qty: qty, take: take };
}
/* A majority holder can absorb the company: its plant, its stock and its debts
   come across, and the minority is bought out at a premium. */
function acquire(G, buyer, targetId) {
  var t = G.co[targetId];
  if (!t || t.bankrupt) return { ok: false, msg: "Nothing to acquire." };
  var mine = heldBy(G, buyer, targetId);
  if (mine < t.shares * 0.5) return { ok: false, msg: "You need more than half the shares first." };
  var minority = floatOf(G, t) + (t.shares - mine - floatOf(G, t));
  var payout = minority * t.sharePrice * 1.15;
  if (buyer.cash - buyer.escrow < payout) return { ok: false, msg: "Buying out the minority costs " + Math.round(payout).toLocaleString() + "." };
  buyer.cash -= payout; buyer.day.capex += payout; G.flow.sink += payout;
  // cancel the target's resting orders so nothing is double counted
  REGIONS.forEach(function (r) {
    COMM.forEach(function (c) {
      var bk = book(G, r.id, c.id);
      ["bids", "asks"].forEach(function (side) {
        for (var i = bk[side].length - 1; i >= 0; i--) if (bk[side][i].co === t.id) {
          var o = bk[side][i]; bk[side].splice(i, 1); releaseOrder(G, o);
        }
      });
    });
  });
  t.buildings.slice().forEach(function (b) { b.owner = buyer.id; buyer.buildings.push(b); });
  t.buildings = [];
  REGIONS.forEach(function (r) {
    var inv = t.inv[r.id] || {};
    for (var c in inv) { invAdd(buyer, r.id, c, inv[c]); }
    t.inv[r.id] = {}; t.res[r.id] = {};
  });
  buyer.cash += t.cash; t.cash = 0;
  buyer.debt += t.debt; t.debt = 0;
  G.contracts.forEach(function (k) {
    if (k.seller === t.id) k.seller = buyer.id;
    if (k.buyer === t.id) k.buyer = buyer.id;
  });
  G.shipments.forEach(function (sh) { if (sh.co === t.id) sh.co = buyer.id; if (sh.carrier === t.id) sh.carrier = buyer.id; });
  t.bankrupt = true; t.sharePrice = 0;
  buyer.absorbed = (buyer.absorbed || 0) + 1;
  G.companies.forEach(function (c) { if (c.held) delete c.held[t.id]; });
  logMsg(G, buyer.name + " has absorbed " + t.name + ".", buyer.isPlayer ? "good" : "event");
  return { ok: true };
}
/* The financier goes shopping when it is liquid and somebody is cheap. */
function aiFinancier(G, co) {
  if (G.day < 60) return;                       // the market needs time to find its prices
  if (co.cash - co.escrow < 250000) return;
  var best = null;
  G.companies.forEach(function (t) {
    if (t === co || t.bankrupt || t.isPlayer) return;
    if (t.buildings.length < 3) return;
    var mine = heldBy(G, co, t.id);
    var cheap = t.sharePrice * t.shares / Math.max(1, valuation(G, t));
    if (cheap < 1.05 && (!best || mine > heldBy(G, co, best.id))) best = t;
  });
  if (!best) return;
  // capital moves fast only when the payback is obvious, otherwise boards deliberate
  var waited = G.day - co.ai.lastBuild;
  if (waited < (best.pay < 25 ? 8 : best.pay < 40 ? 16 : 25)) return;
  if (heldBy(G, co, best.id) >= best.shares * 0.5) { acquire(G, co, best.id); return; }
  buyShares(G, co, best.id, Math.floor((co.cash - co.escrow) * 0.12 / Math.max(0.5, best.sharePrice)));
}

/* ---------- daily tick ---------- */
function tick(G) {
  if (G.over) return;
  G.flow = { faucet: 0, sink: 0, by: {} };
  eventTick(G);
  eraTick(G);
  computeFactors(G);
  macroTick(G);
  produceAll(G);
  postConsumerOrders(G);
  aiAll(G);
  playerStanding(G);
  REGIONS.forEach(function (r) { COMM.forEach(function (c) { matchBook(G, r.id, c.id); }); });
  runContracts(G);
  arriveShipments(G);
  updateBalance(G);
  markBooks(G);
  expireOrders(G);
  dayEnd(G);
  shareTick(G);
  if (G.day % 30 === 0) dividends(G);
  // price history and volume roll
  REGIONS.forEach(function (r) {
    COMM.forEach(function (c) {
      var bk = book(G, r.id, c.id);
      bk.hist.push({ d: G.day, p: round2(bk.ema), v: bk.dayVol });
      if (bk.hist.length > 400) bk.hist.shift();
      bk.vol = bk.dayVol; bk.dayVol = 0; bk.dayVal = 0;
    });
  });
  // the wider economy grows slowly, which is what makes new capacity worth building
  G.growth = (G.growth || 1) * 1.0016;
  // timber regrows
  REGIONS.forEach(function (r) {
    var rs = G.regionState[r.id];
    if (rs.deposits.timber !== undefined) rs.deposits.timber += 55;
  });
  // persistent shortages attract new capital
  if (G.day % 25 === 0) {
    COMM.forEach(function (c) {
      var b = G.balance[c.id];
      if (b && b.cap > 0 && b.used > b.cap * 1.15 && price(G, "HAL", c.id) > c.p0 * 1.15)
        G.pendingEntrant = Math.min(3, (G.pendingEntrant || 0) + 1);
    });
  }
  var alive = 0;
  G.companies.forEach(function (c) { if (!c.bankrupt) alive++; });
  if (G.pendingEntrant && G.day % 12 === 0 && alive < 15) {
    G.pendingEntrant--;
    newEntrant(G);
  }
  G.day++;
  checkGoals(G);
}

/* Rolling ten-day view of what the world makes and what it burns. */
function updateBalance(G) {
  var made = {}, used = {}, cap = {};
  G.buildings.forEach(function (b) {
    var d = BUILD[b.type], th = levelThroughput(b), co = G.co[b.owner];
    if (!co) return;
    var om = outMult(G, co, b);
    for (var o in d.out) {
      cap[o] = (cap[o] || 0) + d.out[o] * th * om;
      if (buildingActive(b)) made[o] = (made[o] || 0) + d.out[o] * th * om * b.util;
    }
    // half what plants actually burn, half what they would burn if fed: a starved
    // chain must still register as short, without pricing in idle nameplate
    for (var i in d.inp) if (buildingActive(b))
      used[i] = (used[i] || 0) + d.inp[i] * th * (0.45 * b.util + 0.55 * (b.rate || 1));
  });
  REGIONS.forEach(function (r) {
    for (var cid in CONSUMER_GOODS) {
      if (CONSUMER_GOODS[cid].era > G.era) continue;
      used[cid] = (used[cid] || 0) + CONSUMER_GOODS[cid].q * (r.demand / DEMAND_WEIGHT) * G.econ * (G.growth || 1) *
        G.regionState[r.id].demandMod * (G.demandMod[cid] || 1);
    }
  });
  G.scarce = G.scarce || {};
  COMM.forEach(function (c) {
    var b0 = G.balance[c.id] || { made: 0, used: 0, cap: 0 };
    G.balance[c.id] = {
      made: b0.made * 0.85 + (made[c.id] || 0) * 0.15,
      used: b0.used * 0.85 + (used[c.id] || 0) * 0.15,
      cap: cap[c.id] || 0
    };
    var bb2 = G.balance[c.id];
    var short = bb2.made > 0 ? (bb2.used / Math.max(1, bb2.made) - 1) : 0;
    G.scarce[c.id] = clamp(short, -0.4, 0.6);
  });
}

/* A failed firm's ground does not stay idle for long. */
function newEntrant(G) {
  var used = {}; G.companies.forEach(function (c) { used[c.name] = 1; });
  var name = null;
  for (var i = 0; i < E.NAMES.length; i++) if (!used[E.NAMES[i]]) { name = E.NAMES[i]; break; }
  if (!name) name = "Consortium " + G.day;
  var archs = ["extractor", "processor", "manufacturer", "trader", "hauler"];
  var arch = archs[Math.floor(G.rnd() * archs.length)];
  var co = newCompany(G, name, arch, 600000, false);
  var keys = Object.keys(PERSONA);
  co.persona = keys[Math.floor(G.rnd() * keys.length) % keys.length];
  co.policy = { wage: PERSONA[co.persona].wage, green: PERSONA[co.persona].green };
  co.sharePrice = Math.max(0.4, valuation(G, co) / co.shares);
  // the receivers hand them a going concern in whatever the world is short of
  var short = null, gap = 0;
  COMM.forEach(function (c) {
    var b = G.balance[c.id];
    if (!b) return;
    var d = (b.used - b.made) / Math.max(1, b.used);
    if (d > gap) { gap = d; short = c.id; }
  });
  var type = "warehouse";
  for (var t in BUILD) if (BUILD[t].out[short]) type = t;
  var rid = "HAL";
  if (BUILD[type].dep) {
    REGIONS.forEach(function (r) { if ((G.regionState[r.id].deposits[BUILD[type].dep] || 0) > 50000) rid = r.id; });
  }
  if (canBuild(G, co, type, rid).ok) addBuilding(G, co, type, rid, true);
  if (canBuild(G, co, type, rid).ok) addBuilding(G, co, type, rid, true);
  if (canBuild(G, co, "warehouse", rid).ok) addBuilding(G, co, "warehouse", rid, true);
  if (!co.buildings.length) { addBuilding(G, co, "warehouse", "HAL", true); }
  logMsg(G, name + " enters the market with " + BUILD[type].name.toLowerCase() + " capacity in " + RMAP[rid].name + ".", "market");
}

/* ---------- goals ---------- */
var GOALS = [
  { id:"solvent",  name:"Turn a profit for 30 straight days", test: function (G, co) {
      if (co.hist.length < 30) return false;
      return co.hist.slice(-30).every(function (h) { return h.p > 0; }); } },
  { id:"integrate", name:"Own an extraction site, a processing plant and a factory", test: function (G, co) {
      var t = {}; co.buildings.forEach(function (b) { t[BUILD[b.type].cls] = 1; });
      return t.extract && t.process && t.factory; } },
  { id:"regional", name:"Operate in four regions", test: function (G, co) {
      var r = {}; co.buildings.forEach(function (b) { r[b.rid] = 1; });
      return Object.keys(r).length >= 4; } },
  { id:"share",    name:"Take 40% of one commodity's traded volume", test: function (G, co) {
      var sh = marketShare(G, co); var best = 0;
      for (var k in sh) best = Math.max(best, sh[k]);
      return best >= 0.4; } },
  { id:"val5",     name:"Reach a company valuation of $1,500,000", test: function (G, co) {
      return co.valuation >= 1500000; } },
  { id:"pioneer",  name:"Open a new age of industry before the rest of the trade", test: function (G, co) {
      return (G.eraLog || []).some(function (e) { return e.pioneer; }); } },
  { id:"absorb",   name:"Absorb a rival company", test: function (G, co) {
      return !!co.absorbed; } },
  { id:"val25",    name:"Reach a company valuation of $5,000,000", test: function (G, co) {
      return co.valuation >= 5000000; } },
  { id:"profit10", name:"Bank $2,000,000 of cumulative profit", test: function (G, co) {
      return co.cum.profit >= 2000000; } }
];
function checkGoals(G) {
  var co = G.player; if (!co || co.bankrupt) return;
  co.goals = co.goals || {};
  GOALS.forEach(function (g) {
    if (co.goals[g.id]) return;
    if (g.test(G, co)) {
      co.goals[g.id] = G.day;
      logMsg(G, "Milestone: " + g.name + ".", "good");
      if (g.id === "val25" || g.id === "val5m") G.over = { win: true, reason: "You built one of the great industrial houses." };
    }
  });
}
function marketShare(G, co) {
  var mine = {}, all = {};
  G.companies.forEach(function (c) {
    for (var k in c.stats.sold) {
      all[k] = (all[k] || 0) + c.stats.sold[k];
      if (c === co) mine[k] = (mine[k] || 0) + c.stats.sold[k];
    }
  });
  var out = {};
  for (var k2 in all) if (all[k2] > 50) out[k2] = (mine[k2] || 0) / all[k2];
  return out;
}

/* ---------- market intelligence (imperfect without the terminal) ---------- */
function marketView(G, co, rid, cid) {
  var bk = book(G, rid, cid);
  var full = !!(co && co.tech && co.tech.market_terminal);
  function agg(arr, n) {
    var levels = [], map = {};
    arr.forEach(function (o) {
      var p = full ? o.price : Math.round(o.price * 20) / 20;
      if (!map[p]) { map[p] = { price: p, qty: 0, mine: 0 }; levels.push(map[p]); }
      map[p].qty += o.qty;
      if (co && o.co === co.id) map[p].mine += o.qty;
    });
    return levels.slice(0, n);
  }
  var supply = 0, demand = 0;
  bk.asks.forEach(function (o) { supply += o.qty; });
  bk.bids.forEach(function (o) { demand += o.qty; });
  if (!full) {
    supply = Math.round(supply * (0.8 + G.rnd() * 0.4) / 10) * 10;
    demand = Math.round(demand * (0.8 + G.rnd() * 0.4) / 10) * 10;
  }
  return {
    bids: agg(bk.bids, full ? 12 : 4), asks: agg(bk.asks, full ? 12 : 4),
    last: bk.last, ema: bk.ema, vol: bk.vol, supply: supply, demand: demand,
    trades: full ? bk.trades.slice(-14) : bk.trades.slice(-6).map(function (t) {
      return { d: t.d, p: t.p, q: t.q, b: "", s: "" }; }),
    hist: bk.hist
  };
}

/* ---------- player actions ---------- */
var act = {
  order: function (G, side, cid, rid, price, qty) { return placeOrder(G, G.player, side, cid, rid, price, qty, 6); },
  cancel: function (G, id) {
    var o = null;
    G.player.orders.forEach(function (x) { if (x.id === id) o = x; });
    return o ? cancelOrder(G, o) : false;
  },
  build: function (G, type, rid) {
    var co = G.player, d = BUILD[type];
    if (co.cash - co.escrow < d.cap) return { ok: false, msg: "Not enough free cash." };
    var permit = canBuild(G, co, type, rid);
    if (!permit.ok) return permit;
    addBuilding(G, co, type, rid);
    logMsg(G, "Construction complete: " + d.name + " in " + RMAP[rid].name + ".", "good");
    return { ok: true };
  },
  upgrade: function (G, bid) {
    var co = G.player, b = null;
    co.buildings.forEach(function (x) { if (x.id === bid) b = x; });
    if (!b) return { ok: false, msg: "No such site." };
    if (b.level >= 4) return { ok: false, msg: "Already at maximum capacity." };
    var cost = BUILD[b.type].cap * 0.7 * b.level;
    if (co.cash - co.escrow < cost) return { ok: false, msg: "Not enough free cash." };
    co.cash -= cost; co.day.capex += cost; b.level++;
    return { ok: true };
  },
  autohaul: function (G) { G.player.autoHaul = G.player.autoHaul === false; return { ok: true }; },
  standing: function (G, bid, which) {
    G.player.buildings.forEach(function (b) {
      if (b.id !== bid) return;
      if (which === "buy") b.autoBuy = !b.autoBuy; else b.autoSell = !b.autoSell;
    });
    return { ok: true };
  },
  toggleIdle: function (G, bid) {
    G.player.buildings.forEach(function (b) { if (b.id === bid) b.idle = !b.idle; });
    return { ok: true };
  },
  sell: function (G, bid) {
    var co = G.player, b = null;
    co.buildings.forEach(function (x) { if (x.id === bid) b = x; });
    if (!b) return { ok: false };
    var v = sellBuilding(G, co, b, 0.62);
    logMsg(G, "Sold " + BUILD[b.type].name.toLowerCase() + " in " + RMAP[b.rid].name + " for $" + Math.round(v).toLocaleString() + ".", "info");
    return { ok: true };
  },
  ship: function (G, from, to, cid, qty) {
    var s = startShipment(G, G.player, from, to, cid, qty, null);
    return s ? { ok: true } : { ok: false, msg: "Cannot dispatch that load." };
  },
  takeJob: function (G, jid) {
    var j = null;
    G.jobs.forEach(function (x) { if (x.id === jid) j = x; });
    if (!j) return { ok: false, msg: "Job already taken." };
    return takeJob(G, G.player, j) ? { ok: true } : { ok: false, msg: "No spare haulage capacity." };
  },
  offer: function (G, side, cid, rid, qtyPer, interval, deliveries, price) {
    postOffer(G, G.player, side, cid, rid, qtyPer, interval, deliveries, price);
    return { ok: true };
  },
  acceptOffer: function (G, oid) {
    var o = null;
    G.offers.forEach(function (x) { if (x.id === oid) o = x; });
    if (!o) return { ok: false, msg: "Offer withdrawn." };
    return acceptOffer(G, G.player, o) ? { ok: true } : { ok: false, msg: "Offer withdrawn." };
  },
  research: function (G, id) {
    var co = G.player, t = TECH[id];
    if (co.research) return { ok: false, msg: "Already running a programme." };
    if (co.tech[id]) return { ok: false, msg: "Already held." };
    for (var i = 0; i < t.req.length; i++) if (!co.tech[t.req[i]]) return { ok: false, msg: "Needs " + TECH[t.req[i]].name + " first." };

      '<span class="cap">' + m0(s.cash) + " opening capital" +
      (s.grant.length ? " &middot; " + s.grant.length + " site" + (s.grant.length > 1 ? "s" : "") : " &middot; no plant") +
      "</span></div>";
  }).join("");
  return '<div class="overlay"><div class="sheet">' +
    '<h1>company<span class="dot">.co</span></h1>' +
    '<p class="lede">One machine in a struggling town, five ages of industry ahead of you. ' +
    "Every price on the order book is made by somebody buying or selling, and every age opens chains " +
    "nobody can supply yet. Dig it up, refine it, build with it, trade it, or buy the company that does.</p>" +
    '<div class="form" style="max-width:320px;margin-bottom:18px"><label>Company name</label>' +
    '<input id="coname" value="' + esc(UI.name || "Halloway & Sons") + '" maxlength="26"></div>' +
    '<div class="paths">' + paths + "</div>" +
    '<div style="margin-top:20px;display:flex;gap:10px;align-items:center">' +
    '<button class="primary" data-act="begin">Open for business</button>' +
    '<span class="faint">Space pauses. Keys 1-3 set the clock.</span></div>' +
    "</div></div>";
}

function gameScreen() {
  var c = co();
  var tabs = [["dash", "Dashboard"], ["market", "Exchange"], ["ops", "Operations"], ["log", "Logistics"],
              ["contracts", "Contracts"], ["research", "Research"], ["ledger", "Ledger"], ["intel", "Intel"]];
  var head =
    '<header><div class="brand">company<small>.co</small></div>' +
    '<div class="stat era" title="The age of industry. Research pulls the world forward.">' +
      '<b>' + esc(E.ERAS[G.era - 1].name) + '</b><span class="daynum">age ' + G.era + " of 5</span></div>" +
    '<div class="stat clock"><div id="clockface"><b>--:--</b><span></span></div>' +
      '<div class="clockbar"><i id="clockarc"></i></div><span class="daynum">Day ' + G.day + "</span></div>" +
    stat("Company", esc(c.name)) +
    stat("Cash", m0(c.cash - c.escrow) + (c.escrow > 1 ? '<span class="faint"> +' + money(c.escrow) + " held</span>" : "")) +
    stat("Valuation", m0(c.valuation)) +
    stat("Yesterday", spanCls(c.hist.length ? c.hist[c.hist.length - 1].p : 0)) +
    '<div class="speed">' +
      '<button class="' + (UI.speed === 0 ? "primary" : "") + '" data-act="speed" data-v="0">Pause</button>' +
      '<button class="' + (UI.speed === 1 ? "primary" : "") + '" data-act="speed" data-v="1">1x</button>' +
      '<button class="' + (UI.speed === 2 ? "primary" : "") + '" data-act="speed" data-v="2">2x</button>' +
      '<button class="' + (UI.speed === 3 ? "primary" : "") + '" data-act="speed" data-v="3">4x</button>' +
      '<button data-act="step">Skip day</button>' +
      '<button class="menubtn" data-act="menu" title="Pause menu (Esc)">Menu</button></div></header>';
  var nav = "<nav>" + tabs.map(function (t) {
    return '<button class="' + (UI.tab === t[0] ? "on" : "") + '" data-act="tab" data-id="' + t[0] + '">' + t[1] + "</button>";
  }).join("") + "</nav>";
  var body = "";
  if (UI.tab === "dash") body = tabDash();
  else if (UI.tab === "market") body = tabMarket();
  else if (UI.tab === "ops") body = tabOps();
  else if (UI.tab === "log") body = tabLogistics();
  else if (UI.tab === "contracts") body = tabContracts();
  else if (UI.tab === "research") body = tabResearch();
  else if (UI.tab === "ledger") body = tabLedger();
  else body = tabIntel();
  var over = G.over ? overScreen() : "";
  var tst = (UI.toast && Date.now() - UI.toastT < 2600) ? '<div class="toast">' + esc(UI.toast) + "</div>" : "";
  return head + nav + "<main>" + (UI.err ? '<div class="err" style="margin-bottom:8px">' + esc(UI.err) + "</div>" : "") +
    body + "</main>" + over + tst;
}
function stat(label, v) { return '<div class="stat"><b>' + v + "</b><span>" + label + "</span></div>"; }
function spanCls(v) { return '<span class="' + cls(v) + '">' + m0(v) + "</span>"; }
function card(title, body, extra) {
  return '<div class="card"><h3>' + title + (extra ? "<span>" + extra + "</span>" : "") + "</h3>" +
    '<div class="body">' + body + "</div></div>";
}
function cardRaw(title, body, extra) {
  return '<div class="card"><h3>' + title + (extra ? "<span>" + extra + "</span>" : "") + "</h3>" + body + "</div>";
}

/* ---------- dashboard ---------- */
function economyCard() {
  return card("The economy",
    '<div class="kv"><span>Age of industry</span><b class="amber">' + esc(E.ERAS[G.era - 1].name) + "</b></div>" +
    '<div class="kv"><span>Bank rate</span><b>' + (G.macro.rate * 100).toFixed(1) + "%</b></div>" +
    '<div class="kv"><span>Inflation</span><b class="' + cls(-G.macro.inflation) + '">' +
      (G.macro.inflation * 100).toFixed(1) + "%</b></div>" +
    '<div class="kv"><span>Unemployment</span><b>' + (G.macro.unemployment * 100).toFixed(0) + "%</b></div>" +
    '<div class="kv"><span>Carbon levy</span><b>' + (G.carbonFee ? m0(G.carbonFee) + " a tonne" : "none") + "</b></div>" +
    '<div class="tick">' + esc(E.ERAS[G.era - 1].blurb) + "</div>");
}
function tabDash() {
  var c = co();
  var alerts = [];
  c.buildings.forEach(function (b) {
    var d = E.BUILD[b.type];
    if (b.down > 0) alerts.push(["down", d.name + " in " + E.RMAP[b.rid].name + " is out of action for " + b.down + " more days."]);
    else if (b.idle) alerts.push(["idle", d.name + " in " + E.RMAP[b.rid].name + " is mothballed."]);
    for (var k in d.inp) {
      var cover = E.invGet(c, b.rid, k) / (d.inp[k] * E.levelThroughput(b));
      if (cover < 1.2) alerts.push(["short", d.name + " in " + E.RMAP[b.rid].name + " has " +
        cover.toFixed(1) + " days of " + E.CMAP[k].name.toLowerCase() + " left."]);
    }
  });
  E.REGIONS.forEach(function (r) {
    var u = E.storageUsed(G, c, r.id), cap = E.storageCap(G, c, r.id);
    if (cap > 0 && u > cap * 0.92) alerts.push(["store", "Yards in " + r.name + " are " + Math.round(u / cap * 100) + "% full."]);
  });
  G.contracts.forEach(function (k) {
    if (k.seller !== c.id) return;
    if (k.next - G.day <= 2 && E.avail(c, k.rid, k.cid) < k.qtyPer)
      alerts.push(["contract", "Contract delivery of " + qty(k.qtyPer) + " " + E.CMAP[k.cid].name.toLowerCase() +
        " in " + E.RMAP[k.rid].name + " due in " + Math.max(0, k.next - G.day) + " days; you are short."]);
  });
  var alertHtml = alerts.length
    ? alerts.slice(0, 9).map(function (a) { return '<div class="kv"><span class="' +
        (a[0] === "short" || a[0] === "contract" ? "down" : "dim") + '">' + esc(a[1]) + "</span></div>"; }).join("")
    : '<div class="faint">Nothing needs you right now.</div>';

  var sites = c.buildings.filter(function (b) { return E.BUILD[b.type].cls !== "support"; });
  var siteRows = sites.slice(0, 10).map(function (b) {
    var d = E.BUILD[b.type];
    return "<tr><td>" + d.name + '</td><td class="dim">' + E.RMAP[b.rid].name + "</td>" +
      '<td class="num">' + Math.round(b.util * 100) + "%</td>" +
      '<td class="num ' + cls(E.estProfit(G, c, b.type, b.rid)) + '">' + m0(E.estProfit(G, c, b.type, b.rid)) + "</td></tr>";
  }).join("") || '<tr><td colspan="4" class="faint">No production sites.</td></tr>';

  var goals = E.GOALS.map(function (g) {
    var done = c.goals && c.goals[g.id];
    return '<div class="kv"><span class="' + (done ? "up" : "dim") + '">' + (done ? "[x] " : "[ ] ") + g.name + "</span>" +
      (done ? '<b class="faint">day ' + done + "</b>" : "") + "</div>";
  }).join("");

  var pos = [];
  liveComms().forEach(function (cm) {
    var t = 0, v = 0;
    E.REGIONS.forEach(function (r) { var q = E.invGet(c, r.id, cm.id); t += q; v += q * E.price(G, r.id, cm.id); });
    if (t > 0.5) pos.push([cm, t, v]);
  });
  pos.sort(function (a, b) { return b[2] - a[2]; });
  var posHtml = pos.length ? pos.slice(0, 8).map(function (p) {
    return '<div class="kv"><span>' + p[0].name + "</span><b>" + qty(p[1]) + " " + p[0].unit +
      ' <span class="faint">' + money(p[2]) + "</span></b></div>"; }).join("")
    : '<div class="faint">No stock on hand.</div>';

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("Company", '<div class="body grid g3">' +
        '<div><div class="faint">Free cash</div><div class="big">' + money(co().cash - co().escrow) + "</div></div>" +
        '<div><div class="faint">Valuation</div><div class="big">' + money(c.valuation) + "</div></div>" +
        '<div><div class="faint">Debt</div><div class="big ' + (c.debt > 0 ? "rust" : "") + '">' + money(c.debt) + "</div></div>" +
        "</div>" +
        '<div class="body" style="padding-top:0"><canvas id="cv-net" height="120"></canvas>' +
        '<div class="tick">Valuation, last 90 days</div></div>') +
      cardRaw("Your sites", '<div class="scroll"><table><thead><tr><th>Site</th><th>Region</th>' +
        '<th class="num">Running</th><th class="num">Margin/day</th></tr></thead><tbody>' + siteRows +
        "</tbody></table></div>") +
      card("Attention", alertHtml) +
      (G.day < 25 ? card("Getting started",
        '<div class="dim" style="font-size:11px;line-height:1.65">' +
        "Each site carries standing orders: it restocks its inputs and sells its output at the going rate. " +
        "That keeps you alive, not rich. The money is in the Exchange - bid under the market when a glut " +
        "builds, sell into a shortage, and watch the Intel screen for what the world is running short of. " +
        "Turn standing orders off in Operations when you want to work the book yourself." +
        "</div>") : "") +
    "</div>" +
    '<div class="grid">' +
      economyCard() +
      card("Stock on hand", posHtml) +
      card("Objectives", goals) +
      cardRaw("Wire", '<div class="body log scroll">' + G.log.slice(0, 22).map(function (l) {
        return '<div><span class="d">' + l.d + '</span><span class="' + l.k + '">' + esc(l.t) + "</span></div>";
      }).join("") + "</div>") +
    "</div></div>";
}

/* ---------- exchange ---------- */
function liveComms() {
  return E.COMM.filter(function (c) { return !c.era || c.era <= G.era; });
}
function tabMarket() {
  var c = co();
  var regionChips = E.REGIONS.map(function (r) {
    return '<span class="chip ' + (UI.region === r.id ? "on" : "") + '" data-act="region" data-id="' + r.id + '">' +
      r.name + "</span>"; }).join("");
  var rows = liveComms().map(function (cm) {
    var bk = E.book(G, UI.region, cm.id);
    var h = bk.hist, prev = h.length > 8 ? h[h.length - 8].p : bk.ema;
    var chg = prev > 0 ? bk.ema / prev - 1 : 0;
    var mine = E.invGet(c, UI.region, cm.id);
    return '<tr class="click ' + (UI.cid === cm.id ? "sel" : "") + '" data-act="cid" data-id="' + cm.id + '">' +
      "<td>" + cm.name + '</td><td class="num">' + px(bk.ema) + "</td>" +
      '<td class="num ' + cls(chg) + '">' + pc(chg) + "</td>" +
      '<td class="num ' + (mine > 0 ? "" : "faint") + '">' + (mine > 0 ? qty(mine) : "-") + "</td>" +
      '<td class="num faint">' + qty(bk.vol) + "</td></tr>";
  }).join("");
  var mv = E.marketView(G, c, UI.region, UI.cid);
  var maxQ = 1;
  mv.bids.concat(mv.asks).forEach(function (l) { if (l.qty > maxQ) maxQ = l.qty; });
  var depth = "";
  for (var i = 0; i < Math.max(mv.bids.length, mv.asks.length); i++) {
    var b = mv.bids[i], a = mv.asks[i];
    depth += '<div class="b" style="--w:' + (b ? b.qty / maxQ * 100 : 0) + '%">' +
      (b ? '<span class="up" data-act="fill" data-side="sell" data-v="' + b.price + '">' + px(b.price) + "</span><span>" +
        qty(b.qty) + (b.mine ? ' <span class="amber">*</span>' : "") + "</span>" : "<span></span><span></span>") + "</div>";
    depth += '<div class="a" style="--w:' + (a ? a.qty / maxQ * 100 : 0) + '%">' +
      (a ? '<span class="down" data-act="fill" data-side="buy" data-v="' + a.price + '">' + px(a.price) + "</span><span>" +
        qty(a.qty) + (a.mine ? ' <span class="amber">*</span>' : "") + "</span>" : "<span></span><span></span>") + "</div>";
  }
  if (!depth) depth = '<div class="faint" style="grid-column:1/3;padding:6px">The book is empty.</div>';

  var trades = mv.trades.slice().reverse().map(function (t) {
    return '<div class="kv"><span class="faint">day ' + t.d + "</span><b>" + px(t.p) +
      ' <span class="dim">x' + qty(t.q) + "</span></b></div>"; }).join("") ||
    '<div class="faint">No recent business.</div>';

  var myOrders = c.orders.filter(function (o) { return true; }).map(function (o) {
    return "<tr><td>" + (o.side === "buy" ? '<span class="up">Bid</span>' : '<span class="down">Offer</span>') + "</td>" +
      "<td>" + E.CMAP[o.cid].name + '</td><td class="dim">' + o.rid + "</td>" +
      '<td class="num">' + px(o.price) + '</td><td class="num">' + qty(o.qty) + "</td>" +
      '<td class="num faint">' + o.ttl + "d" + (o.auto ? ' <span class="pill">auto</span>' : "") + "</td>" +
      '<td><button data-act="cancel" data-id="' + o.id + '">Pull</button></td></tr>';
  }).join("") || '<tr><td colspan="7" class="faint">No live orders.</td></tr>';

  var cm2 = E.CMAP[UI.cid];
  var stock = E.invGet(c, UI.region, UI.cid);
  var bal = G.balance[UI.cid] || { made: 0, used: 0 };
  var full = !!c.tech.market_terminal;
  var supply = full ? qty(mv.supply) : "~" + qty(mv.supply);
  var demand = full ? qty(mv.demand) : "~" + qty(mv.demand);

  return '<div style="margin-bottom:10px">' + regionChips + "</div>" +
    '<div class="grid g12">' +
      cardRaw(E.RMAP[UI.region].name + " prices",
        '<div class="scroll"><table><thead><tr><th>Commodity</th><th class="num">Price</th>' +
        '<th class="num">7d</th><th class="num">Yours</th><th class="num">Vol</th></tr></thead><tbody>' +
        rows + "</tbody></table></div>") +
      '<div class="grid">' +
        cardRaw(cm2.name + " &middot; " + E.RMAP[UI.region].name,
          '<div class="body"><canvas id="cv-price" height="150"></canvas>' +
          '<div class="tick">Settlement price, last 120 days. Reference ' + px(cm2.p0) + " per " + cm2.unit + ".</div></div>",
          px(E.price(G, UI.region, UI.cid))) +
        '<div class="grid g2">' +
          cardRaw("Order book", '<div class="depth" style="padding:6px">' + depth + "</div>",
            "bids / offers") +
          card("Ticket",
            '<div class="row" style="margin-bottom:7px">' +
              '<button class="' + (UI.f.oside === "buy" ? "primary" : "") + '" data-act="side" data-v="buy">Buy</button>' +
              '<button class="' + (UI.f.oside === "sell" ? "primary" : "") + '" data-act="side" data-v="sell">Sell</button>' +
            "</div>" +
            '<div class="form">' +
              '<div class="row"><div><label>Quantity</label><input data-f="oqty" value="' + esc(UI.f.oqty) + '" placeholder="0"></div>' +
              '<div><label>Limit price</label><input data-f="oprice" value="' + esc(UI.f.oprice) + '" placeholder="' +
                E.price(G, UI.region, UI.cid).toFixed(2) + '"></div></div>' +
              '<div class="row"><button data-act="order" data-kind="limit">Post limit</button>' +
              '<button data-act="order" data-kind="market">Take the market</button></div>' +
            "</div>" +
            '<div class="tick">You hold ' + qty(stock) + " " + cm2.unit + " here. Free cash " + money(c.cash - c.escrow) +
            ". Exchange fee 0.35%.</div>") +
        "</div>" +
        '<div class="grid g2">' +
          card("Recent trades", trades) +
          card("Balance", '<div class="kv"><span>Offered here</span><b>' + supply + "</b></div>" +
            '<div class="kv"><span>Wanted here</span><b>' + demand + "</b></div>" +
            '<div class="kv"><span>World output</span><b>' + (full ? qty(bal.made) : "~" + qty(bal.made)) + "/day</b></div>" +
            '<div class="kv"><span>World consumption</span><b>' + (full ? qty(bal.used) : "~" + qty(bal.used)) + "/day</b></div>" +
            (full ? "" : '<div class="tick">Figures are trade gossip. A market terminal would give you the real book.</div>')) +
        "</div>" +
        cardRaw("Your orders", '<div class="scroll"><table><thead><tr><th>Side</th><th>Commodity</th><th>Where</th>' +
          '<th class="num">Price</th><th class="num">Qty</th><th class="num">Expires</th><th></th></tr></thead><tbody>' +
          myOrders + "</tbody></table></div>") +
      "</div></div>";
}

/* ---------- operations ---------- */
function policyCard() {
  var c = co();
  function seg(kind, opts) {
    return '<div class="seg">' + opts.map(function (o) {
      return '<button class="' + (c.policy[kind] === o[0] ? "on" : "") + '" data-act="policy" data-k="' + kind +
        '" data-v="' + o[0] + '">' + o[1] + "</button>";
    }).join("") + "</div>";
  }
  var wp = E.WAGE_POLICY[c.policy.wage], gp = E.GREEN_POLICY[c.policy.green];
  return cardRaw("Board policy",

      Math.round(wp.prod * 100) + "%. Lean crews walk out sooner when the district is short of hands.</div>" +

    '<div class="tick">Power at ' + Math.round(gp.energy * 100) + "% of cost, chimneys at " +
      Math.round(gp.emit * 100) + "% of standard. You have put out " + qty(Math.round(c.emissions || 0)) +
      " tonnes so far" + (G.carbonFee ? ", taxed at " + m0(G.carbonFee) + " a tonne" : "; untaxed for now") + ".</div>");
}
function tabOps() {
  var c = co();
  var rows = c.buildings.map(function (b) {
    var d = E.BUILD[b.type], sup = d.cls === "support";

    return "<tr><td>" + d.name + (b.level > 1 ? ' <span class="amber">L' + b.level + "</span>" : "") + "</td>" +

      '<td class="num">' + Math.round(b.util * 100) + "%</td>" +
      '<td class="dim">' + out + "</td>" +

  }).join("") || '<tr><td colspan="8" class="faint">You own no sites.</td></tr>';

  var types = Object.keys(E.BUILD).map(function (t) {
    return '<option value="' + t + '" ' + (UI.f.bType === t ? "selected" : "") + ">" + E.BUILD[t].name +
      " &middot; " + money(E.BUILD[t].cap) + "</option>"; }).join("");
  var regions = E.REGIONS.map(function (r) {
    return '<option value="' + r.id + '" ' + (UI.f.bRegion === r.id ? "selected" : "") + ">" + r.name + "</option>"; }).join("");
  var d = E.BUILD[UI.f.bType], rid = UI.f.bRegion;
  var profit = E.estProfit(G, c, UI.f.bType, rid);
  var payback = profit > 0 ? Math.round(d.cap / profit) : null;
  var recipe = Object.keys(d.inp).map(function (k) { return qty(d.inp[k]) + " " + E.CMAP[k].name.toLowerCase(); }).join(" + ");
  var makes = Object.keys(d.out).map(function (k) { return qty(d.out[k]) + " " + E.CMAP[k].name.toLowerCase(); }).join(" + ");
  var dep = d.dep ? qty(G.regionState[rid].deposits[d.dep] || 0) + " " + E.CMAP[d.dep].name.toLowerCase() + " left in the ground" : "";

  var yards = E.REGIONS.map(function (r) {
    var u = E.storageUsed(G, c, r.id), cap = E.storageCap(G, c, r.id);
    return '<div class="kv"><span>' + r.name + "</span><b>" + Math.round(u) + " / " + Math.round(cap) +
      '</b></div><div class="bar"><i style="width:' + Math.min(100, u / Math.max(1, cap) * 100) + '%"></i></div>';
  }).join("");

  return '<div class="grid g21">' +
    cardRaw("Sites", '<div class="scroll" style="max-height:520px"><table><thead><tr><th>Site</th><th>Region</th>' +

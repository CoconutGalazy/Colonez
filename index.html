/* ---------- logistics ---------- */
function tabLogistics() {
  var c = co();
  var regions = E.REGIONS.map(function (r) { return { id: r.id, name: r.name }; });
  function opts(sel, f) {
    return regions.map(function (r) {
      return '<option value="' + r.id + '" ' + (UI.f[f] === r.id ? "selected" : "") + ">" + r.name + "</option>"; }).join("");
  }
  var comms = liveComms().map(function (cm) {
    return '<option value="' + cm.id + '" ' + (UI.f.sCid === cm.id ? "selected" : "") + ">" + cm.name + "</option>"; }).join("");
  var q = parseInt(UI.f.sQty, 10) || 0;
  var cost = q > 0 ? E.freightCost(G, c, UI.f.sFrom, UI.f.sTo, UI.f.sCid, q) : 0;
  var self = E.haulCap(G, c) - E.haulUsed(G, c) >= q * E.CMAP[UI.f.sCid].w;
  var days = E.transitDays(UI.f.sFrom, UI.f.sTo);
  var have = E.avail(c, UI.f.sFrom, UI.f.sCid);

  var transit = G.shipments.filter(function (s) { return s.co === c.id || s.payTo === c.id; }).map(function (s) {
    var own = s.co === c.id;
    return "<tr><td>" + (own ? E.CMAP[s.cid].name : '<span class="amber">carrying</span> ' + E.CMAP[s.cid].name) + "</td>" +
      '<td class="num">' + qty(s.qty) + '</td><td class="dim">' + s.from + " to " + s.to + "</td>" +
      '<td class="num">' + Math.max(0, s.arrive - G.day) + "d</td>" +
      '<td class="num">' + (own ? m0(-s.cost) : '<span class="up">' + m0(s.pay || 0) + "</span>") + "</td></tr>";
  }).join("") || '<tr><td colspan="5" class="faint">Nothing on the road.</td></tr>';

  var capFree = E.haulCap(G, c) - E.haulUsed(G, c);
  var jobs = G.jobs.filter(function (j) { return !j.taken; }).slice(0, 14).map(function (j) {
    return "<tr><td>" + E.CMAP[j.cid].name + '</td><td class="num">' + qty(j.qty) + "</td>" +
      '<td class="dim">' + j.from + " to " + j.to + '</td><td class="num">' + Math.round(j.load) + "</td>" +
      '<td class="num up">' + m0(j.pay * (c.tech.fleet_scale ? 1.15 : 1)) + "</td>" +
      '<td><button data-act="job" data-id="' + j.id + '" ' + (capFree < j.load ? "disabled" : "") + ">Take</button></td></tr>";
  }).join("") || '<tr><td colspan="6" class="faint">No loads on offer today.</td></tr>';

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("The map", '<div class="body"><canvas id="cv-map" height="330"></canvas>' +
        '<div class="tick">Road distances in kilometres. Your sites are marked in amber.</div></div>') +
      cardRaw("On the road", '<div class="scroll"><table><thead><tr><th>Cargo</th><th class="num">Qty</th>' +
        '<th>Route</th><th class="num">Arrives</th><th class="num">Cost</th></tr></thead><tbody>' + transit +
        "</tbody></table></div>") +
    "</div>" +
    '<div class="grid">' +
      card("Dispatch a load", '<div class="form">' +
        '<div class="row"><div><label>From</label><select data-f="sFrom" data-live="1">' + opts(0, "sFrom") + "</select></div>" +
        '<div><label>To</label><select data-f="sTo" data-live="1">' + opts(0, "sTo") + "</select></div></div>" +
        '<div><label>Cargo</label><select data-f="sCid" data-live="1">' + comms + "</select></div>" +
        '<div><label>Quantity</label><input data-f="sQty" data-live="1" value="' + esc(UI.f.sQty) + '" placeholder="0"></div>' +
        '<button class="primary" data-act="ship">Dispatch</button></div>' +
        '<div class="tick">You hold ' + qty(have) + " there. " +
        (q > 0 ? "Freight " + m0(cost) + " (" + px(cost / q) + " a unit), " + days + " day" + (days > 1 ? "s" : "") + " on the road. " +
          (self ? "Your own fleet carries it at 45% off." : "A carrier takes the job.") : "Enter a quantity for a quote.") +
        "</div>") +
      card("Fleet", '<div class="kv"><span>Haulage capacity</span><b>' + qty(E.haulCap(G, c)) + "</b></div>" +
        '<div class="kv"><span>In use</span><b>' + qty(E.haulUsed(G, c)) + "</b></div>" +
        '<div class="bar"><i style="width:' + Math.min(100, E.haulUsed(G, c) / Math.max(1, E.haulCap(G, c)) * 100) + '%"></i></div>' +
        '<div class="bar"><i style="width:' + Math.min(100, E.haulUsed(G, c) / Math.max(1, E.haulCap(G, c)) * 100) + '%"></i></div>'.slice(0,0) +
        '<div class="kv"><span>Traffic office</span><span class="chip ' + (c.autoHaul === false ? "" : "on") +
        '" data-act="autohaul">' + (c.autoHaul === false ? "off" : "takes spare loads") + '</span></div>' +
        '<div class="tick">Each truck depot carries 600 load units. Heavy ores take more room than machines. ' +
        'With the traffic office on, idle trucks pick up loads from the board on their own.</div>') +
      cardRaw("Freight board", '<div class="scroll"><table><thead><tr><th>Cargo</th><th class="num">Qty</th><th>Route</th>' +
        '<th class="num">Load</th><th class="num">Pays</th><th></th></tr></thead><tbody>' + jobs + "</tbody></table></div>") +
    "</div></div>";
}

/* ---------- contracts ---------- */
function tabContracts() {
  var c = co();
  var mine = G.contracts.filter(function (k) { return k.seller === c.id || k.buyer === c.id; }).map(function (k) {
    var selling = k.seller === c.id;
    var other = G.co[selling ? k.buyer : k.seller];
    var short = selling && E.avail(c, k.rid, k.cid) < k.qtyPer;
    return "<tr><td>" + (selling ? '<span class="down">Supply</span>' : '<span class="up">Take</span>') + "</td>" +
      "<td>" + E.CMAP[k.cid].name + '</td><td class="num">' + qty(k.qtyPer) + "</td>" +
      '<td class="num">' + px(k.price) + '</td><td class="dim">' + E.RMAP[k.rid].name + "</td>" +
      "<td>" + esc(other ? other.name : "-") + '</td><td class="num">' + k.left + "</td>" +
      '<td class="num">' + Math.max(0, k.next - G.day) + "d" + (short ? ' <span class="down">short</span>' : "") + "</td></tr>";
  }).join("") || '<tr><td colspan="8" class="faint">No contracts running.</td></tr>';

  var open = G.offers.filter(function (o) { return o.from !== c.id; }).map(function (o) {
    var from = G.co[o.from];
    var fair = E.price(G, o.rid, o.cid);
    var edge = o.side === "sell" ? (fair - o.price) / fair : (o.price - fair) / fair;
    return "<tr><td>" + esc(from ? from.name : "-") + "</td>" +
      "<td>" + (o.side === "sell" ? "offers" : "wants") + " " + E.CMAP[o.cid].name + "</td>" +
      '<td class="num">' + qty(o.qtyPer) + " x" + o.deliveries + "</td>" +
      '<td class="num">' + px(o.price) + '</td><td class="num ' + cls(edge) + '">' + pc(edge) + "</td>" +
      '<td class="dim">' + E.RMAP[o.rid].name + " &middot; every " + o.interval + "d</td>" +
      '<td><button data-act="accept" data-id="' + o.id + '">Sign</button></td></tr>';
  }).join("") || '<tr><td colspan="7" class="faint">Nobody is offering terms today.</td></tr>';

  var mineOffers = G.offers.filter(function (o) { return o.from === c.id; }).map(function (o) {
    return "<tr><td>" + (o.side === "sell" ? "Supplying" : "Buying") + " " + E.CMAP[o.cid].name + "</td>" +
      '<td class="num">' + qty(o.qtyPer) + " x" + o.deliveries + '</td><td class="num">' + px(o.price) + "</td>" +
      '<td class="dim">' + E.RMAP[o.rid].name + '</td><td class="faint">expires in ' + o.ttl + "d</td></tr>";
  }).join("") || '<tr><td colspan="5" class="faint">You have nothing on the board.</td></tr>';

  var comms = liveComms().map(function (cm) {
    return '<option value="' + cm.id + '" ' + (UI.f.kCid === cm.id ? "selected" : "") + ">" + cm.name + "</option>"; }).join("");
  var regs = E.REGIONS.map(function (r) {
    return '<option value="' + r.id + '" ' + (UI.f.kRegion === r.id ? "selected" : "") + ">" + r.name + "</option>"; }).join("");
  var total = (parseInt(UI.f.kQty, 10) || 0) * (parseInt(UI.f.kCount, 10) || 0) * (parseFloat(UI.f.kPrice) || 0);
  var span = (parseInt(UI.f.kCount, 10) || 0) * (parseInt(UI.f.kEvery, 10) || 0);

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("Your contracts", '<div class="scroll"><table><thead><tr><th>Side</th><th>Commodity</th>' +
        '<th class="num">Per run</th><th class="num">Price</th><th>Where</th><th>Counterparty</th>' +
        '<th class="num">Left</th><th class="num">Next</th></tr></thead><tbody>' + mine + "</tbody></table></div>") +
      cardRaw("Open terms", '<div class="scroll"><table><thead><tr><th>Firm</th><th>Terms</th>' +
        '<th class="num">Volume</th><th class="num">Price</th><th class="num">vs market</th><th>Detail</th>' +
        "<th></th></tr></thead><tbody>" + open + "</tbody></table></div>") +
      cardRaw("Posted by you", '<div class="scroll"><table><tbody>' + mineOffers + "</tbody></table></div>") +
    "</div>" +
    '<div class="grid">' +
      card("Write a contract", '<div class="form">' +
        '<div><label>Direction</label><select data-f="kSide" data-live="1">' +
          '<option value="sell" ' + (UI.f.kSide === "sell" ? "selected" : "") + ">I supply</option>" +
          '<option value="buy" ' + (UI.f.kSide === "buy" ? "selected" : "") + ">I buy</option></select></div>" +
        '<div><label>Commodity</label><select data-f="kCid" data-live="1">' + comms + "</select></div>" +
        '<div><label>Delivered at</label><select data-f="kRegion" data-live="1">' + regs + "</select></div>" +
        '<div class="row"><div><label>Units per run</label><input data-f="kQty" data-live="1" value="' + esc(UI.f.kQty) + '"></div>' +
        '<div><label>Every (days)</label><input data-f="kEvery" data-live="1" value="' + esc(UI.f.kEvery) + '"></div></div>' +
        '<div class="row"><div><label>Runs</label><input data-f="kCount" data-live="1" value="' + esc(UI.f.kCount) + '"></div>' +
        '<div><label>Price per unit</label><input data-f="kPrice" data-live="1" value="' + esc(UI.f.kPrice) + '" placeholder="' +
          E.price(G, UI.f.kRegion, UI.f.kCid).toFixed(2) + '"></div></div>' +
        '<button class="primary" data-act="offer">Post to the board</button></div>' +
        '<div class="tick">Market price today ' + px(E.price(G, UI.f.kRegion, UI.f.kCid)) + ". " +
        "Total " + m0(total) + " over " + span + " days. Miss a delivery and you pay a quarter of its value " +
        "and lose standing." + (co().tech.futures_desk ? " Your futures desk allows terms up to 180 days." :
        " Without a futures desk you are limited to 60 days.") + "</div>") +
      card("Standing", '<div class="kv"><span>Reputation</span><b>' + (c.rep * 100).toFixed(0) + "/100</b></div>" +
        '<div class="bar"><i style="width:' + Math.min(100, c.rep * 83) + '%"></i></div>' +
        '<div class="tick">Reliable delivery earns better terms and cheaper credit. Defaults cost both.</div>') +
    "</div></div>";
}

/* ---------- research ---------- */
function tabResearch() {
  var c = co();
  var cur = c.research
    ? '<div class="kv"><span>' + E.TECH[c.research.id].name + "</span><b>" + c.research.left + " days left</b></div>" +
      '<div class="bar"><i style="width:' + ((1 - c.research.left / c.research.total) * 100) + '%"></i></div>' +
      '<div class="tick">Costs ' + m0(E.TECH[c.research.id].cost / c.research.total) + " a day while it runs.</div>"
    : '<div class="faint">No programme running.</div>';
  var cards = Object.keys(E.TECH).map(function (id) {
    var t = E.TECH[id], have = !!c.tech[id];
    var blocked = t.req.filter(function (r) { return !c.tech[r]; });
    return '<div class="card"><h3>' + t.name + "<span>" + (have ? '<span class="pill on">held</span>' : money(t.cost)) + "</span></h3>" +
      '<div class="body"><div class="dim" style="min-height:42px">' + t.desc + "</div>" +
      '<div class="tick">' + (blocked.length ? "Requires " + blocked.map(function (r) { return E.TECH[r].name; }).join(", ") :
        t.days + " days of work") + "</div>" +
      (have ? "" : '<button data-act="research" data-id="' + id + '" ' +
        (c.research || blocked.length ? "disabled" : "") + ">Begin</button>") + "</div></div>";
  }).join("");
  return card("Programme", cur) + '<div class="grid g3" style="margin-top:12px">' + cards + "</div>";
}

/* ---------- ledger ---------- */
function m2(v) { return "$" + (Math.round(v * 100) / 100).toLocaleString(); }
function tabLedger() {
  var c = co();
  function sum(days) {
    var t = {}, h = c.hist.slice(-days);
    h.forEach(function (row) { for (var k in row.l) t[k] = (t[k] || 0) + row.l[k]; });
    t.profit = h.reduce(function (a, r) { return a + r.p; }, 0);
    return t;
  }
  var a = sum(1), b = sum(30);
  function line(label, key, neg) {
    var va = (a[key] || 0) * (neg ? -1 : 1), vb = (b[key] || 0) * (neg ? -1 : 1);
    return "<tr><td>" + label + '</td><td class="num ' + (neg ? "down" : "") + '">' + m0(va) +
      '</td><td class="num ' + (neg ? "down" : "") + '">' + m0(vb) + "</td></tr>";
  }
  var inv = 0;
  E.REGIONS.forEach(function (r) {
    var iv = c.inv[r.id] || {};
    for (var k in iv) inv += iv[k] * E.price(G, r.id, k);
  });
  var plant = E.assetValue(G, c) - inv * 0.9;
  var limit = E.creditLimit(G, c);

  var listed = G.companies.filter(function (x) { return !x.bankrupt && !x.isPlayer; })
    .sort(function (x, y) { return y.sharePrice - x.sharePrice; });
  var shareRows = listed.map(function (t) {
    var mine = E.heldBy(G, c, t.id), pctOwn = mine / t.shares;
    var canTake = pctOwn >= 0.5;
    return "<tr><td>" + esc(t.name) + '<div class="dim">' + esc(E.PERSONA[t.persona || "dominator"].name) + "</div></td>" +
      '<td class="num">' + m2(t.sharePrice) + '<div class="dim">' + m0(t.sharePrice * t.shares) + " all in</div></td>" +
      '<td class="num">' + (mine ? qty(mine) + '<div class="dim">' + (pctOwn * 100).toFixed(0) + "%</div>" : '<span class="faint">-</span>') + "</td>" +
      '<td class="num nowrap">' +
      '<button class="mini" data-act="buyshares" data-id="' + t.id + '" title="Buy about ' + m0(25000) +
        ' of stock">buy ' + m0(25000) + "</button>" +
      (mine ? '<button class="mini" data-act="sellshares" data-id="' + t.id + '">sell half</button>' : "") +
      (canTake ? '<button class="mini go" data-act="acquire" data-id="' + t.id + '">absorb</button>' : "") +
      "</td></tr>";
  }).join("");
  var holdVal = 0;
  listed.forEach(function (t) { holdVal += E.heldBy(G, c, t.id) * t.sharePrice; });

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("Trading account", "<table><thead><tr><th>Item</th><th class=\"num\">Yesterday</th>" +
        '<th class="num">Last 30 days</th></tr></thead><tbody>' +
        line("Sales", "rev") + line("Materials bought", "cogs", 1) + line("Wages", "wages", 1) +
        line("Power", "energy", 1) + line("Maintenance", "maint", 1) + line("Freight", "freight", 1) +
        line("Storage", "storage", 1) + line("Exchange fees", "fees", 1) + line("Research", "research", 1) +
        line("Interest", "interest", 1) + line("Penalties", "penalty", 1) + line("Tax", "tax", 1) +
        '<tr><td><b>Profit</b></td><td class="num ' + cls(a.profit) + '"><b>' + m0(a.profit || 0) + "</b></td>" +
        '<td class="num ' + cls(b.profit) + '"><b>' + m0(b.profit || 0) + "</b></td></tr>" +
        '<tr><td class="faint">Capital spending</td><td class="num faint">' + m0(-(a.capex || 0)) + "</td>" +
        '<td class="num faint">' + m0(-(b.capex || 0)) + "</td></tr>" +
        "</tbody></table>") +
      cardRaw("Cash", '<div class="body"><canvas id="cv-cash" height="130"></canvas>' +
        '<div class="tick">Cash balance, last 90 days. A company can be profitable and still run out.</div></div>') +
    "</div>" +
    '<div class="grid">' +
      card("Balance sheet",
        '<div class="kv"><span>Cash</span><b>' + m0(c.cash) + "</b></div>" +
        '<div class="kv"><span>Committed to open bids</span><b>' + m0(-c.escrow) + "</b></div>" +
        '<div class="kv"><span>Stock at market</span><b>' + m0(inv) + "</b></div>" +
        '<div class="kv"><span>Plant and equipment</span><b>' + m0(plant) + "</b></div>" +
        (holdVal > 0 ? '<div class="kv"><span>Shares in other firms</span><b>' + m0(holdVal) + "</b></div>" : "") +
        '<div class="kv"><span>Debt</span><b class="rust">' + m0(-c.debt) + "</b></div>" +
        '<div class="kv"><span>Company valuation</span><b class="amber">' + m0(c.valuation) + "</b></div>" +
        '<div class="kv"><span>Cumulative profit</span><b class="' + cls(c.cum.profit) + '">' + m0(c.cum.profit) + "</b></div>") +
      cardRaw("The stock list", '<div class="scroll" style="max-height:300px"><table><thead><tr>' +
        '<th>Company</th><th class="num">Share</th><th class="num">You hold</th><th></th>' +
        "</tr></thead><tbody>" + shareRows + "</tbody></table></div>" +
        '<div class="tick">Prices follow book value with a mood attached. Buy more than half a company ' +
        "and you can absorb it - its plant, stock and debts come across, and the minority is bought out " +
        "at a premium. Dividends are paid every thirty days out of profit.</div>") +
      card("Credit",
        '<div class="kv"><span>Outstanding</span><b>' + m0(c.debt) + "</b></div>" +
        '<div class="kv"><span>Still available</span><b>' + m0(limit) + "</b></div>" +
        '<div class="kv"><span>Rate</span><b>' + ((G.macro.rate + (1.1 - c.rep) * 0.05) * 100).toFixed(1) +
          '% a year</b></div><div class="tick">The bank rate is ' + (G.macro.rate * 100).toFixed(1) +
          '% and moves with inflation and the cycle.</div>' +
        '<div class="form" style="margin-top:8px"><input data-f="loan" value="' + esc(UI.f.loan) + '" placeholder="Amount">' +
        '<div class="row"><button data-act="borrow">Draw</button><button data-act="repay">Repay</button></div></div>') +
    "</div></div>";
}

/* ---------- intel ---------- */
function tabIntel() {
  var c = co();
  var full = !!c.tech.market_terminal;
  var head = "<tr><th>Commodity</th>" + E.REGIONS.map(function (r) {
    return '<th class="num">' + r.id + "</th>"; }).join("") +
    '<th class="num">Made</th><th class="num">Used</th><th class="num">Yours</th></tr>';
  var rows = liveComms().map(function (cm) {
    var bal = G.balance[cm.id] || { made: 0, used: 0 };
    var mine = 0; E.REGIONS.forEach(function (r) { mine += E.invGet(c, r.id, cm.id); });
    return "<tr><td>" + cm.name + "</td>" + E.REGIONS.map(function (r) {
      var p = E.price(G, r.id, cm.id);
      var rel = p / cm.p0 - 1;
      return '<td class="num ' + (rel > 0.12 ? "up" : rel < -0.12 ? "down" : "") + '">' + px(p) + "</td>";
    }).join("") +
      '<td class="num faint">' + (full ? qty(bal.made) : "~" + qty(Math.round(bal.made / 5) * 5)) + "</td>" +
      '<td class="num faint">' + (full ? qty(bal.used) : "~" + qty(Math.round(bal.used / 5) * 5)) + "</td>" +
      '<td class="num">' + (mine > 0.5 ? qty(mine) : "-") + "</td></tr>";
  }).join("");

  var share = E.marketShare(G, c);
  var rivals = G.companies.filter(function (x) { return !x.isPlayer && !x.bankrupt; })
    .sort(function (x, y) { return y.valuation - x.valuation; }).map(function (x) {
      var v = full ? m0(x.valuation) : "~" + money(Math.round(x.valuation / 100000) * 100000);
      var sectors = {};
      x.buildings.forEach(function (b) { if (E.BUILD[b.type].cls !== "support") sectors[E.BUILD[b.type].name] = 1; });
      return "<tr><td>" + esc(x.name) + '</td><td class="dim">' + E.ARCH[x.arch].name + "</td>" +

/* ---------- charts ---------- */
function ctxFor(id) {
  var cv = document.getElementById(id);
  if (!cv) return null;
  var w = cv.clientWidth || 300, h = cv.height;
  var dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.style.height = h + "px";
  cv.height = h * dpr;
  var g = null;
  try { g = cv.getContext("2d"); } catch (e) { g = null; }
  if (!g) return null;              // canvas unavailable: charts sit out, the rest still draws
  g.scale(dpr, dpr);
  return { g: g, w: w, h: h };
}
function lineChart(id, pts, color, fmt) {
  var c = ctxFor(id);
  if (!c || pts.length < 2) return;
  var g = c.g, w = c.w, h = c.h, pad = 26;
  var lo = Infinity, hi = -Infinity;
  pts.forEach(function (p) { if (p < lo) lo = p; if (p > hi) hi = p; });
  if (hi - lo < 1e-6) { hi = lo + 1; lo -= 1; }
  var span = hi - lo;
  lo -= span * 0.12; hi += span * 0.12;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = "#221D18"; g.lineWidth = 1;
  for (var i = 0; i <= 3; i++) {
    var y = 6 + (h - 18) * i / 3;
    g.beginPath(); g.moveTo(pad, y); g.lineTo(w - 4, y); g.stroke();
    g.fillStyle = "#6A6055"; g.font = "9px ui-monospace, monospace";
    g.fillText(fmt(hi - (hi - lo) * i / 3), 2, y + 3);
  }
  g.beginPath();
  pts.forEach(function (p, i) {
    var x = pad + (w - pad - 4) * i / (pts.length - 1);
    var y = 6 + (h - 18) * (1 - (p - lo) / (hi - lo));
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  });
  g.strokeStyle = color; g.lineWidth = 1.4; g.stroke();
  g.lineTo(w - 4, h - 12); g.lineTo(pad, h - 12); g.closePath();
  var grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color.replace(")", ",.18)").replace("rgb", "rgba"));
  grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad; g.fill();
}
function drawCharts() {
  if (UI.screen !== "game" || !G) return;
  var c = co();
  if (UI.tab === "dash") {
    lineChart("cv-net", c.netHist.slice(-90).map(function (x) { return x.v; }), "rgb(224,163,46)", function (v) { return money(v); });
  } else if (UI.tab === "market") {
    var h = E.book(G, UI.region, UI.cid).hist.slice(-120).map(function (x) { return x.p; });
    lineChart("cv-price", h, "rgb(180,83,42)", function (v) { return px(v); });
  } else if (UI.tab === "ledger") {
    lineChart("cv-cash", c.hist.slice(-90).map(function (x) { return x.cash; }), "rgb(143,168,95)", function (v) { return money(v); });
  } else if (UI.tab === "log") {
    drawMap();
  }
}
function drawMap() {
  var c = ctxFor("cv-map");
  if (!c) return;
  var g = c.g, w = c.w, h = c.h;
  g.clearRect(0, 0, w, h);
  var sx = w / 700, sy = h / 470;
  function P(r) { return { x: 30 + r.x * sx * 0.9, y: 20 + r.y * sy * 0.9 }; }
  g.font = "10px ui-monospace, monospace";
  E.REGIONS.forEach(function (a, i) {
    E.REGIONS.forEach(function (b, j) {
      if (j <= i) return;
      var pa = P(a), pb = P(b);
      var key = a.id < b.id ? a.id + "|" + b.id : b.id + "|" + a.id;
      var blocked = (G.freightMod[key] || 1) > 1.5;
      g.strokeStyle = blocked ? "#C7573A" : "#2E2823";
      g.lineWidth = blocked ? 1.6 : 1;
      g.beginPath(); g.moveTo(pa.x, pa.y); g.lineTo(pb.x, pb.y); g.stroke();
      g.fillStyle = "#4A4038";
      g.fillText(E.dist(a.id, b.id) + "km", (pa.x + pb.x) / 2 - 12, (pa.y + pb.y) / 2 - 3);
    });
  });
  G.shipments.forEach(function (s) {
    var a = P(E.RMAP[s.from]), b = P(E.RMAP[s.to]);
    var total = Math.max(1, E.transitDays(s.from, s.to));
    var t = 1 - Math.max(0, s.arrive - G.day) / total;
    var x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    g.fillStyle = s.co === co().id ? "#E0A32E" : "#4A4038";
    g.fillRect(x - 2, y - 2, 4, 4);
  });
  E.REGIONS.forEach(function (r) {
    var p = P(r);
    var mine = co().buildings.filter(function (b) { return b.rid === r.id; }).length;
    g.beginPath(); g.arc(p.x, p.y, 7, 0, Math.PI * 2);
    g.fillStyle = mine ? "#B4532A" : "#221D18";
    g.strokeStyle = mine ? "#E0A32E" : "#4A4038";
    g.fill(); g.stroke();
    g.fillStyle = "#E8E1D4"; g.font = "11px ui-monospace, monospace";
    g.fillText(r.name, p.x + 12, p.y + 3);
    g.fillStyle = "#6A6055"; g.font = "9px ui-monospace, monospace";
    var dep = Object.keys(G.regionState[r.id].deposits).map(function (k) { return E.CMAP[k].name; }).join(", ");
    g.fillText(mine ? mine + " of your sites" : (dep || "industrial centre"), p.x + 12, p.y + 15);
  });
}

/* ============================================================
   2. AUTHENTICATION

   PROTOTYPE ONLY. Accounts live in this browser's localStorage. Passwords are
   never stored: we keep a PBKDF2-SHA256 derivation (150k iterations) over a
   random per-account salt, and compare derivations. That is the right shape,
   but client-side storage can be read and edited by anyone at the keyboard, so
   it is not security - it is a stand-in with the correct seams.

   To go to production, implement the same five methods against a real service
   (Firebase Auth, Supabase, Auth0, your own API) and assign it:

       Auth.use(myProvider);

   Nothing else in the game touches account storage, so no other file changes.
   A real provider would also own: email verification, password-reset mail,
   rate limiting, breach checks, and server-side session revocation.

      var all = accounts();

var PHASES = [
  { id: "night",     name: "Night",     from: 0.00, to: 0.22 },

  speed: 1,           // 0 paused, 1, 2, 4
  paused: false,
  last: 0,
  phase: function () {
    for (var i = 0; i < PHASES.length; i++) if (this.t >= PHASES[i].from && this.t < PHASES[i].to) return PHASES[i];
    return PHASES[0];
  },
  label: function () {
    var mins = Math.floor(this.t * 1440), h = Math.floor(mins / 60), m = mins % 60;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;

   stays self-contained with no CDN dependency, it costs a fraction of the

    function rand() { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }

    function rand() { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }

    lastDraw = now;
    var t = Clock.t, p = palette(t);
    var horizon = H * 0.80;

    var sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, p.top); sky.addColorStop(0.55, p.mid); sky.addColorStop(1, p.low);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon);

    var arcT = up ? dayT : (t < 0.18 ? (t + 0.14) / 0.32 : (t - 0.82) / 0.32);
    var sx = W * (0.12 + 0.76 * arcT);
    var sy = horizon - Math.sin(Math.max(0, Math.min(1, arcT)) * Math.PI) * H * 0.56 - H * 0.04;

    ctx.restore();
    ctx.save();

    for (var i = 0; i < 14; i++) {
      var yy = horizon + (i + 1) * (H - horizon) / 15;
      var ph = Date.now() / 1400 + i;
      ctx.beginPath();
      ctx.moveTo(sx - W * 0.05 + Math.sin(ph) * 6, yy);
      ctx.lineTo(sx + W * 0.05 + Math.cos(ph) * 6, yy);
      ctx.stroke();
    }
    ctx.restore();

    // treeline, swaying gently
    var trees = ridges[ridges.length - 1];
    if (trees && trees.trees) {
      var sway = Profile.settings.reduceMotion ? 0 : Math.sin(Date.now() / 2600) * 3;
      ctx.save(); ctx.globalAlpha = trees.alpha;
      ctx.translate(sway, 0);
      ctx.drawImage(trees.trees, 0, 0, W, H);
      ctx.restore();
    }

    // motes: pollen in daylight, fireflies after dark
    if (motes.length && !Profile.settings.reduceMotion) {
      var night = t < 0.2 || t > 0.8;
      ctx.save();
      motes.forEach(function (m) {
        m.ph += dt * (night ? 1.6 : 0.5);
        m.x += m.s * dt * 12; if (m.x > W + 10) m.x = -10;
        var a = night ? 0.25 + 0.45 * Math.abs(Math.sin(m.ph)) : 0.12;
        ctx.globalAlpha = a;
        ctx.fillStyle = night ? "#ffe9a8" : "#ffffff";
        ctx.beginPath();
        ctx.arc(m.x, m.y + Math.sin(m.ph) * 5, m.r, 0, 6.283);
        ctx.fill();
      });
      ctx.restore();
    }

    // vignette keeps the middle of the screen calm behind the panels
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  return {
    init: function () {
      cv = $("sky");

      document.addEventListener("visibilitychange", function () { hidden = document.hidden; });

})();

   6. AUDIO

    (meta ? '<p>Your last session left <b>' + esc(meta.company) + '</b> on day ' + meta.day +
      ' with a valuation of ' + esc(meta.valuation) + '.</p>' +
      '<div class="rowend"><button data-s="newventure" class="ghost">Start a new venture</button>' +
      '<button data-s="continue" class="primary">Continue</button></div>'
      : '<p>You have no company on the books yet. Choose how you want to enter the market.</p>' +
        '<div class="rowend"><button data-s="newventure" class="primary">Begin</button></div>') +
    '</div></div>');
}

/* ============================================================
   10. TUTORIAL - six short cards, skippable, replayable from settings
   ============================================================ */
var TUT = [
  { title: "One machine, five ages",
    icon: "exchange",
    body: "You are running an industrial company in a country of five regions, at the start of a long " +
          "climb from steam and iron to robotics. Everything you buy and sell passes through one order " +
          "book, and every price on it was made by somebody choosing to trade." },
  { title: "Reading the room",
    icon: "book",
    body: "The tabs along the top are your desks. Dashboard is the state of your company, Exchange is the " +
          "order book, Operations is your plant, Logistics moves goods between regions. Nothing is hidden " +
          "behind menus - if you can see it, you can act on it." },
  { title: "Buying and selling",
    icon: "order",
    body: "On the Exchange, pick a region and a commodity, then post a bid or an offer. A bid holds your " +
          "cash until it fills or lapses; an offer holds the goods. Match the best price on the book if you " +
          "want it now, or price it your own way and wait." },
  { title: "What you are aiming at",
    icon: "goal",
    body: "Buy inputs, make something worth more than they cost, and sell it where it is wanted. Your " +
          "board sets wages and how clean the chimneys are, and both show up in the accounts. The " +
          "Dashboard lists milestones - your first profitable month, plant in four regions, a real share of " +
          "a market. There is no last day: play until you have built something you like." },
  { title: "Growing an empire",
    icon: "grow",
    body: "Profit buys more plant, better plant, or research. Research also opens the next age early - " +
          "polymers, electronics, robotics - and for a while you are the only firm in the country who can " +
          "make the thing everyone suddenly wants. Every rival is listed on the stock list too: buy half a " +
          "company and you can absorb it whole. Cash, not paper profit, keeps you alive." },
  { title: "Time is slow here",
    icon: "clock",
    body: "A day takes about a minute and a half of real time, and passes through morning, afternoon, " +
          "evening and night. Nothing is racing you. Pause whenever you like with the space bar, or speed " +
          "the clock up when you are waiting on a delivery." }
];
var tut = { i: 0, open: false };
function tutIcon(kind) {
  var paths = {
    exchange: '<path d="M6 26 L18 10 L30 26" /><circle cx="18" cy="10" r="2.4"/>',
    book: '<rect x="7" y="8" width="22" height="20" rx="2"/><path d="M18 8 v20"/>',
    order: '<path d="M8 22 h20"/><path d="M8 15 h13"/><path d="M8 29 h7"/>',
    goal: '<circle cx="18" cy="18" r="10"/><circle cx="18" cy="18" r="4"/>',
    grow: '<path d="M8 28 L15 18 L21 23 L30 9"/>',
    clock: '<circle cx="18" cy="18" r="10"/><path d="M18 12 v7 l5 3"/>'
  };
  return '<svg viewBox="0 0 36 36" class="ticon">' + (paths[kind] || paths.book) + "</svg>";
}
function tutorialShow() {
  var s = TUT[tut.i];
  tut.open = true;
  Clock.paused = true;
  Layer.html('<div class="veil"><div class="panel tut pop">' +
    '<div class="tuthead">' + tutIcon(s.icon) +
    '<div><h2>' + esc(s.title) + '</h2><span class="step">' + (tut.i + 1) + " / " + TUT.length + "</span></div></div>" +
    "<p>" + esc(s.body) + "</p>" +
    '<div class="dots">' + TUT.map(function (x, i) {
      return '<i class="' + (i === tut.i ? "on" : i < tut.i ? "done" : "") + '"></i>'; }).join("") + "</div>" +
    '<div class="rowend">' +
    '<button class="link" data-s="tutskip">Skip tutorial</button>' +
    (tut.i > 0 ? '<button class="ghost" data-s="tutback">Back</button>' : "") +
    '<button class="primary" data-s="tutnext">' + (tut.i === TUT.length - 1 ? "Start trading" : "Next") + "</button>" +
    "</div></div></div>");
}
function tutorialFinish(skipped) {
  tut.open = false;
  Profile.flags.tutorialDone = true;
  Profile.saveFlags();
  Layer.clear();
  Clock.paused = false;
  if (!skipped) notify("Tutorial complete. Replay it any time from Settings.");
}

/* ============================================================
   11. CONTEXTUAL HINTS - one line, once, then never again
   ============================================================ */
var HINTS = [
  { id: "first-order", when: function (G) { return G.player.orders.length > 0; },
    text: "Your order is on the book. It holds cash or goods until it fills, and lapses after a few days." },
  { id: "low-cash", when: function (G) { return G.player.cash - G.player.escrow < 8000; },
    text: "Cash is running low. The Ledger tab can draw on your credit line, and idle plant still costs upkeep." },
  { id: "short-input", when: function (G) {
      return G.player.buildings.some(function (b) {
        var d = E.BUILD[b.type];
        for (var k in d.inp) if (E.invGet(G.player, b.rid, k) < d.inp[k]) return true;
        return false; }); },
    text: "A site is short of inputs. Standing orders restock automatically, or buy it yourself on the Exchange." },
  { id: "first-contract", when: function (G) { return G.contracts.some(function (k) {
      return k.seller === G.player.id || k.buyer === G.player.id; }); },
    text: "Contracts fix a price for weeks. Miss a delivery and you pay damages, so keep the stock in the right region." },
  { id: "storage-full", when: function (G) {
      return E.REGIONS.some(function (r) {
        return E.storageUsed(G, G.player, r.id) > E.storageCap(G, G.player, r.id) * 0.9; }); },
    text: "Your yards are nearly full. Production stops when there is nowhere to put the output - sell, ship, or build a warehouse." },
  { id: "event-live", when: function (G) { return G.events.length > 0 && G.day > 20; },
    text: "Something has happened in the wider economy. Events move prices - the Wire on your Dashboard explains what." }
];
var hintNow = null;
function hintCheck() {
  if (!Profile.settings.hints || hintNow || Layer.open()) return;
  var G = window.MXUI && window.MXUI.getG();
  if (!G || G.over) return;
  for (var i = 0; i < HINTS.length; i++) {
    var h = HINTS[i];
    if (Profile.flags.hints[h.id]) continue;
    var fires = false;
    try { fires = h.when(G); } catch (e) { fires = false; }
    if (fires) { showHint(h); return; }
  }
}
function showHint(h) {
  hintNow = h;
  var box = document.createElement("div");
  box.className = "hint";
  box.innerHTML = '<b>A note</b><p>' + esc(h.text) + "</p>" +
    '<div class="rowend"><button class="link" data-s="hintgot">Got it</button></div>';
  $("notes").appendChild(box);
  setTimeout(function () { box.classList.add("in"); }, 20);
  hintNow.el = box;
}
function hintDismiss() {
  if (!hintNow) return;
  Profile.flags.hints[hintNow.id] = true;
  Profile.saveFlags();
  if (hintNow.el && hintNow.el.parentNode) hintNow.el.parentNode.removeChild(hintNow.el);
  hintNow = null;
}

/* ============================================================
   12. PAUSE AND SETTINGS
   ============================================================ */
var resumeSpeed = 1;
function pauseOpen() {
  resumeSpeed = window.MXUI ? window.MXUI.UI.speed : 1;
  Clock.paused = true;
  saveGame("pause");
  Layer.html('<div class="veil"><div class="panel pop">' +
    '<h2>Paused</h2><p class="sub">Day ' + (window.MXUI.getG() ? window.MXUI.getG().day : 1) +
    ", " + Clock.label() + " \u00b7 " + Clock.phase().name + "</p>" +
    '<div class="menu">' +
    '<button class="primary" data-s="resume">Resume</button>' +
    '<button data-s="settings">Settings</button>' +
    '<button data-s="tutorialreplay">Tutorial</button>' +
    '<button data-s="controls">Controls</button>' +
    '<button data-s="savenow">Save game</button>' +
    '<button data-s="mainmenu">Main menu</button>' +
    '<button data-s="logout">Log out</button>' +
    "</div></div></div>");
}
function pauseClose() {
  Layer.clear();
  Clock.paused = false;
  if (window.MXUI) { window.MXUI.UI.speed = resumeSpeed; window.MXUI.render(); }
}
function row(label, control, note) {
  return '<div class="setrow"><div><b>' + label + "</b>" + (note ? "<span>" + note + "</span>" : "") +
    "</div><div>" + control + "</div></div>";
}
function slider(key, val) {
  return '<input type="range" min="0" max="100" value="' + Math.round(val * 100) + '" data-set="' + key + '">' +
    '<em>' + Math.round(val * 100) + "</em>";
}
function choice(key, val, opts) {
  return '<div class="seg">' + opts.map(function (o) {
    return '<button class="' + (String(val) === String(o[0]) ? "on" : "") + '" data-set="' + key +
      '" data-v="' + o[0] + '">' + o[1] + "</button>";
  }).join("") + "</div>";
}
function toggle(key, val) {
  return '<button class="sw ' + (val ? "on" : "") + '" data-set="' + key + '" data-v="toggle"><i></i></button>';
}
var setScroll = 0;
function settingsOpen(keepScroll) {
  var s = Profile.settings;
  Layer.html('<div class="veil"><div class="panel wide pop">' +
    '<h2>Settings</h2>' +
    '<div class="setgrid">' +
    row("Master volume", slider("master", s.master)) +
    row("Music and ambience", slider("music", s.music)) +
    row("Sound effects", slider("sfx", s.sfx)) +
    row("Graphics", choice("quality", s.quality, [["low", "Low"], ["medium", "Medium"], ["high", "High"]]),
        "Lower settings thin out the scene and cap its frame rate") +
    row("Day length", choice("dayLength", s.dayLength, [[180, "Unhurried"], [90, "Steady"], [45, "Brisk"]]),
        "Real seconds per in-game day at 1x") +
    row("Reduced motion", toggle("reduceMotion", s.reduceMotion), "Stills the scene and removes transitions") +
    row("Larger text", toggle("largeText", s.largeText)) +
    row("Contextual hints", toggle("hints", s.hints)) +
    row("Autosave", toggle("autosave", s.autosave), "Writes to this browser as the days pass") +
    row("Full screen", '<button data-s="fullscreen">Toggle</button>') +
    row("Tutorial", '<button data-s="tutorialreplay">Replay tutorial</button>' +
        '<button data-s="hintsreset" class="ghost">Reset hints</button>') +
    row("Account", '<span class="dimtext">' + esc(Profile.email) + "</span>" +
        '<button data-s="logout" class="ghost">Log out</button>') +
    "</div>" +
    '<div class="rowend"><button class="ghost" data-s="wipe">Delete saved game</button>' +
    '<button class="primary" data-s="closesettings">Done</button></div>' +
    "</div></div>");
  var list = document.querySelector("#shell .setgrid");
  if (list) {
    if (keepScroll) list.scrollTop = setScroll;
    else setScroll = 0;
    list.addEventListener("scroll", function () { setScroll = list.scrollTop; });
  }
}
function controlsOpen() {
  Layer.html('<div class="veil"><div class="panel pop">' +
    "<h2>Controls</h2>" +
    '<table class="keys"><tbody>' +
    "<tr><td><kbd>Space</kbd></td><td>Pause and resume the clock</td></tr>" +
    "<tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Clock speed</td></tr>" +
    "<tr><td><kbd>Esc</kbd></td><td>Pause menu, or close what is open</td></tr>" +
    "<tr><td><kbd>Enter</kbd></td><td>Confirm a form</td></tr>" +
    "</tbody></table>" +
    '<p class="sub">Everything else is a click. Panels that accept input say so.</p>' +
    '<div class="rowend"><button class="primary" data-s="backtopause">Back</button></div></div></div>');
}

/* ============================================================
   13. SAVE AND LOAD
   ============================================================ */
var lastSave = 0;
function saveGame(reason) {
  var G = window.MXUI && window.MXUI.getG();
  if (!G || !Profile.uid) return false;
  if (reason === "auto" && !Profile.settings.autosave) return false;
  try {
    var snap = E.snapshot(G);
    var meta = { company: G.player.name, day: G.day,
                 valuation: "$" + Math.round(G.player.valuation).toLocaleString(),
                 arch: G.player.arch, clock: Clock.t };
    var ok = Profile.writeSave(snap, meta);
    lastSave = Date.now();
    if (!ok && reason !== "auto") notify("Saved for this session only - this browser refused to store it.", "bad");
    return ok;
  } catch (e) {
    if (reason !== "auto") notify("Could not save: " + e.message, "bad");
    return false;
  }
}
function loadGame() {
  var rec = Profile.readSave();
  if (!rec) return false;
  try {
    var G = E.restore(rec.snap);
    window.MXUI.setG(G);
    if (rec.meta && typeof rec.meta.clock === "number") Clock.t = rec.meta.clock;
    return true;
  } catch (e) {
    notify("That saved game could not be opened: " + e.message, "bad");
    return false;
  }
}

/* ============================================================
   14. FLOW
   launch -> restore session? -> welcome -> continue or new venture -> tutorial -> game
   ============================================================ */
function enterGame(fresh) {
  Layer.clear();
  Clock.paused = false;
  Audio_.start();
  window.MXUI.render();
  if (fresh && Profile.settings.tutorial && !Profile.flags.tutorialDone) {
    tut.i = 0;
    setTimeout(tutorialShow, 400);
  }
}
function startNewVenture() {
  fade(function () {
    Layer.clear();
    window.MXUI.showStart();
    Clock.t = 0.26;
  });
}
function afterLogin(session) {
  Profile.load(session.uid, session.email);
  Auth.rememberEmail(session.email);
  applySettings();
  Audio_.start();
  fade(function () { screenWelcome(); });
}
function logout(skipConfirm) {
  function go() {
    saveGame("logout");
    Auth.signOut();
    Clock.paused = true;
    if (window.MXUI) window.MXUI.clear();
    authForm.password = ""; authForm.confirm = ""; authForm.err = ""; authForm.ok = "";
    authForm.email = Auth.lastEmail();
    fade(function () { screenLogin(); });
  }
  if (skipConfirm) go();
  else confirmBox("Log out?", "Your game is saved first, and will be waiting when you come back.", "Log out", go);
}
function applySettings() {
  document.body.classList.toggle("bigtext", !!Profile.settings.largeText);
  document.body.classList.toggle("nomotion", !!Profile.settings.reduceMotion);
  Audio_.volumes();
  Scene.rebuild();
}

/* ============================================================
   15. THE MAIN LOOP
   One requestAnimationFrame drives the clock; the simulation is stepped only
   when a day rolls over, so the cost per frame stays tiny.
   ============================================================ */
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.25, (now - (Clock.last || now)) / 1000);
  Clock.last = now;
  var G = window.MXUI && window.MXUI.getG();
  if (!G || G.over || Layer.open()) { paintClock(); return; }
  Clock.speed = SPEED_MULT[window.MXUI.UI.speed] || 0;
  var days = Clock.advance(dt);
  for (var i = 0; i < days && i < 4; i++) window.MXUI.step();
  if (days) {
    if (Date.now() - lastSave > 20000) saveGame("auto");
    hintCheck();
  }
  Audio_.tickPhase();
  paintClock();
}
var lastClockLabel = "";
function paintClock() {
  var elc = $("clockface");
  if (!elc) return;
  var lab = Clock.label();
  if (lab !== lastClockLabel) {          // once a game-minute, not once a frame
    lastClockLabel = lab;
    elc.innerHTML = "<b>" + lab + "</b><span>" + Clock.phase().name + "</span>";
  }
  var arc = $("clockarc");
  if (arc) arc.style.width = (Clock.t * 100).toFixed(1) + "%";
}

/* ============================================================
   16. EVENTS
   ============================================================ */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-s]");
  if (!t) return;
  var a = t.getAttribute("data-s");
  Audio_.resume();
  if (a !== "hintgot") Audio_.click();
  switch (a) {
    /* auth */
    case "toggleeye": authForm.show = !authForm.show; reRenderAuth(); break;
    case "tosignup": authForm.err = authForm.ok = ""; screenSignup(); break;
    case "tologin": authForm.err = authForm.ok = ""; screenLogin(); break;
    case "toforgot": authForm.err = authForm.ok = ""; screenForgot(); break;
    case "dologin": doLogin(); break;
    case "dosignup": doSignup(); break;
    case "doreset": doReset(); break;
    case "dolocalreset": doLocalReset(); break;
    /* welcome */
    case "continue":
      if (loadGame()) fade(function () { enterGame(false); });
      else startNewVenture();
      break;
    case "newventure":
      if (Profile.hasSave())
        confirmBox("Start a new venture?", "The company you have on the books will be replaced.",
          "Start fresh", function () { Profile.clearSave(); startNewVenture(); });
      else startNewVenture();
      break;
    /* tutorial */
    case "tutnext":
      if (tut.i === TUT.length - 1) tutorialFinish(false);
      else { tut.i++; Audio_.page(); tutorialShow(); }
      break;
    case "tutback": tut.i = Math.max(0, tut.i - 1); Audio_.page(); tutorialShow(); break;
    case "tutskip": tutorialFinish(true); break;
    case "tutorialreplay": tut.i = 0; tutorialShow(); break;
    /* menus */
    case "resume": pauseClose(); break;
    case "settings": settingsOpen(); break;
    case "closesettings": pauseOpen(); break;
    case "controls": controlsOpen(); break;
    case "backtopause": pauseOpen(); break;
    case "savenow": saveGame("manual") && notify("Game saved."); pauseOpen(); break;
    case "mainmenu":
      confirmBox("Return to the main menu?", "Your game is saved first.", "Main menu", function () {
        saveGame("menu"); Clock.paused = true;
        if (window.MXUI) window.MXUI.clear();
        fade(function () { screenWelcome(); });
      });
      break;
    case "logout": logout(false); break;
    case "fullscreen":
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } catch (e) { notify("This browser will not allow full screen here.", "bad"); }
      break;
    case "hintsreset":
      Profile.flags.hints = {}; Profile.saveFlags(); notify("Hints will appear again.");
      break;
    case "wipe":
      confirmBox("Delete the saved game?", "This cannot be undone. Your account and settings stay.",
        "Delete", function () { Profile.clearSave(); notify("Saved game deleted."); settingsOpen(); });
      break;
    case "hintgot": hintDismiss(); break;
    /* confirm box */
    case "cancel": Layer.clear(); if (window.MXUI && window.MXUI.getG()) pauseOpen(); pendingConfirm = null; break;
    case "confirmok":
      var fn = pendingConfirm; pendingConfirm = null; Layer.clear();
      if (fn) fn();
      break;
  }
});
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.dataset.a) {
    authForm[t.dataset.a] = t.type === "checkbox" ? t.checked : t.value;
    return;
  }
  if (t.dataset.set && t.type === "range") {
    Profile.settings[t.dataset.set] = (+t.value) / 100;
    Profile.saveSettings(); Audio_.volumes();
    var em = t.parentNode.querySelector("em");
    if (em) em.textContent = t.value;
  }
});
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-set]");
  if (!t || t.type === "range") return;
  var k = t.getAttribute("data-set"), v = t.getAttribute("data-v");
  if (v === "toggle") Profile.settings[k] = !Profile.settings[k];
  else Profile.settings[k] = isNaN(+v) ? v : +v;
  Profile.saveSettings();
  applySettings();
  settingsOpen(true);       // redraw the list without losing the player's place
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") {
    if (tut.open) return;
    if (Layer.open()) { if (window.MXUI && window.MXUI.getG()) pauseClose(); else Layer.clear(); }
    else if (window.MXUI && window.MXUI.getG()) pauseOpen();
    ev.preventDefault();
    return;
  }
  if (ev.key === "Enter" && document.querySelector("#shell .authcard")) {
    var b = document.querySelector('#shell [data-s^="do"]');
    if (b) b.click();
  }
});
window.addEventListener("beforeunload", function () { saveGame("auto"); });

function reRenderAuth() {
  if (document.querySelector('#shell [data-s="dosignup"]')) screenSignup();
  else if (document.querySelector('#shell [data-s="doreset"]')) screenForgot();
  else if (document.querySelector('#shell [data-s="dolocalreset"]')) screenResetSent(true);
  else screenLogin();
}
function doLogin() {
  authForm.err = ""; authForm.ok = "";
  if (!Auth.validEmail(authForm.email)) { authForm.err = "Enter a valid email address."; screenLogin(); return; }
  if (!authForm.password) { authForm.err = "Enter your password."; screenLogin(); return; }
  authForm.busy = true; screenLogin();
  Auth.signIn(authForm.email, authForm.password, authForm.remember).then(function (r) {
    authForm.busy = false; authForm.password = "";
    Audio_.ok();
    afterLogin(r.session);
  }).catch(function (e) {
    authForm.busy = false; authForm.err = e.message || "Could not sign in."; Audio_.bad(); screenLogin();
  });
}
function doSignup() {
  authForm.err = ""; authForm.ok = "";
  if (authForm.password !== authForm.confirm) { authForm.err = "The two passwords do not match."; screenSignup(); return; }
  authForm.busy = true; screenSignup();
  Auth.signUp(authForm.email, authForm.password, authForm.remember).then(function (r) {
    authForm.busy = false; authForm.password = ""; authForm.confirm = "";
    Audio_.ok();
    afterLogin(r.session);
  }).catch(function (e) {
    authForm.busy = false; authForm.err = e.message || "Could not create the account."; Audio_.bad(); screenSignup();
  });
}
function doReset() {
  if (!Auth.validEmail(authForm.email)) { authForm.err = "Enter a valid email address."; screenForgot(); return; }
  authForm.busy = true; screenForgot();
  Auth.requestReset(authForm.email).then(function (r) {
    authForm.busy = false; authForm.err = ""; authForm.password = "";
    screenResetSent(!!r.localAccount);
  }).catch(function () {
    authForm.busy = false; authForm.err = "Could not send instructions."; screenForgot();
  });
}
function doLocalReset() {
  Auth.changePassword(authForm.email, authForm.password).then(function () {
    authForm.ok = "Password changed. You can log in with it now.";
    authForm.password = "";
    Audio_.ok();
    screenLogin();
  }).catch(function (e) {
    authForm.err = e.message; Audio_.bad(); screenResetSent(true);
  });
}

/* ============================================================
   17. BOOT
   ============================================================ */
function boot() {
  Scene.init();
  requestAnimationFrame(loop);
  var s = Auth.restore();
  authForm.email = Auth.lastEmail() || "";
  if (s) {
    Profile.load(s.uid, s.email);
    applySettings();
    screenWelcome();
  } else {
    Profile.settings = Object.assign({}, DEFAULTS);
    applySettings();
    screenLogin();
  }
}
window.MXShell = {
  boot: boot,
  gameStarted: function () { enterGame(true); saveGame("manual"); },
  pause: pauseOpen,
  settings: settingsOpen,
  afterRender: function () { lastClockLabel = ""; hintCheck(); paintClock(); },
  clock: Clock,
  save: saveGame,
  notify: notify,
  sound: Audio_,
  profile: Profile,
  auth: Auth
};
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();

</script>
